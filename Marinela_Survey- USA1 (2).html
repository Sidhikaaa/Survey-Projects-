<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Snacks Questionnaire - USA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --page:#EEF3FA;
  --panel:#FFFFFF;
  --ink:#15233C;
  --ink-2:#3B4A66;
  --muted:#6D7B94;
  --line:#E3E9F3;
  --line-2:#CBD6E8;
  --blue:#2F6FED;
  --blue-dark:#1E55C6;
  --blue-soft:#EBF2FE;
  --blue-soft-2:#D5E4FD;
  --soft:#F6F9FD;
  --radius:14px;
  --shadow:0 1px 2px rgba(21,35,60,.04), 0 14px 34px -20px rgba(21,35,60,.30);
  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--page);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit}
input{font-family:inherit;font-size:inherit}
table{border-collapse:collapse}

/* ============================================================
   Header
   ============================================================ */
.chrome{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.chrome[hidden]{display:none}
.chrome-top{
  max-width:1180px; margin:0 auto;
  display:flex; align-items:center; gap:16px;
  padding:14px 26px 12px;
}
.study{
  font-size:12px; font-weight:800; letter-spacing:.1em;
  text-transform:uppercase; color:var(--blue); white-space:nowrap;
}
.meta{
  margin-left:auto; display:flex; align-items:center; gap:14px;
  font-size:13px; font-weight:500; color:var(--muted);
}
.pct{
  font-weight:700; color:var(--blue); font-variant-numeric:tabular-nums;
  background:var(--blue-soft); border-radius:100px; padding:3px 11px; font-size:12.5px;
}

.steps{
  max-width:1180px; margin:0 auto; list-style:none;
  display:flex; padding:0 26px 12px; gap:8px;
}
.step{
  flex:1; display:flex; align-items:center; gap:7px; min-width:0;
  font-size:12px; font-weight:600; color:var(--muted);
}
.step-n{
  width:20px; height:20px; flex:none; border-radius:50%;
  border:1.5px solid var(--line-2); background:var(--panel);
  display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; color:var(--muted);
  transition:all .2s ease;
}
.step-l{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.step.is-done .step-n{background:var(--blue-soft-2); border-color:var(--blue-soft-2); color:var(--blue-dark)}
.step.is-done{color:var(--ink-2)}
.step.is-now .step-n{background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 0 4px var(--blue-soft)}
.step.is-now{color:var(--blue)}
.stepnow{display:none}

.track{height:3px; background:var(--blue-soft-2)}
.bar{height:100%; width:0%; background:var(--blue); border-radius:0 3px 3px 0; transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ============================================================
   Layout with side navigation
   ============================================================ */
.layout{
  display:grid; grid-template-columns:minmax(0,1fr);
  justify-content:center; padding:28px 16px 100px;
}
.stage{width:100%; max-width:780px; margin:0 auto}

.panel{
  background:var(--panel);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:32px 34px 34px;
  animation:rise .3s cubic-bezier(.22,.9,.3,1) both;
}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* nav buttons */
.navbar{
  position:fixed; left:0; right:0; bottom:0; height:70px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line); z-index:45;
  padding-bottom:env(safe-area-inset-bottom);
}
.navbar[hidden],.navbtn[hidden],.hint[hidden]{display:none}

.navbtn{
  position:fixed; bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:46; cursor:pointer; border:0;
  display:inline-flex; align-items:center; gap:9px;
  font-weight:700; border-radius:100px;
  transition:background .16s ease, box-shadow .16s ease, opacity .16s ease, transform .12s ease;
}
.navbtn:active{transform:scale(.97)}
.navbtn svg{width:17px; height:17px; flex:none}

.navbtn--back{
  left:16px; padding:11px 20px 11px 15px;
  background:var(--panel); color:var(--ink-2);
  box-shadow:inset 0 0 0 1.5px var(--line-2);
}
.navbtn--back:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--blue); color:var(--blue)}
.navbtn--back:disabled{opacity:.35; cursor:not-allowed}

.navbtn--next{
  right:16px; padding:13px 22px 13px 26px;
  background:var(--blue); color:#fff;
  box-shadow:0 6px 18px -8px rgba(47,111,237,.9);
  font-size:15.5px;
}
.navbtn--next:hover:not(:disabled){background:var(--blue-dark)}
.navbtn--next:disabled{
  background:var(--line-2); color:#fff; cursor:not-allowed; box-shadow:none;
}

.hint{
  position:fixed; bottom:calc(84px + env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%); z-index:46; margin:0;
  max-width:min(86vw,440px);
  background:var(--panel); border:1px solid var(--line);
  box-shadow:0 8px 22px -12px rgba(21,35,60,.45);
  border-radius:100px; padding:8px 18px;
  text-align:center; font-size:12.5px; font-weight:600; color:var(--ink-2);
  opacity:0; transition:opacity .18s ease; pointer-events:none;
}
.hint.is-on{opacity:1}

/* desktop: navigation moves to the sides of the card */
@media (min-width:1180px){
  .layout{padding:34px 16px 92px}
  .navbar{display:none}
  .navbtn{position:fixed; top:50%; bottom:auto; transform:translateY(-50%)}
  .navbtn:active{transform:translateY(-50%) scale(.97)}
  .navbtn--back{
    left:max(24px, calc(50% - 476px)); padding:0;
    width:54px; height:54px; justify-content:center;
  }
  .navbtn--back .lbl{display:none}
  .navbtn--next{
    right:max(24px, calc(50% - 520px));
    padding:15px 24px 15px 28px;
  }
  .hint{bottom:26px}
}

/* ============================================================
   Question head
   ============================================================ */
.q-head{margin-bottom:24px}
.q-num{
  display:inline-block; margin-bottom:12px;
  background:var(--blue-soft); color:var(--blue-dark);
  border-radius:100px; padding:4px 12px;
  font-size:11.5px; font-weight:800; letter-spacing:.06em;
}
.q-num--sub{margin-bottom:10px}
.q-title{font-size:22px; font-weight:800; line-height:1.32; margin:0; letter-spacing:-.015em}
.q-note{margin:10px 0 0; color:var(--muted); font-size:14px; font-weight:500}

.kicker{
  margin:0 0 12px; font-size:11.5px; font-weight:800;
  letter-spacing:.1em; text-transform:uppercase; color:var(--blue);
}

/* ============================================================
   Options
   ============================================================ */
.opts{display:flex; flex-direction:column; gap:9px}
.opts--cols{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:9px}

.opt{
  display:flex; align-items:flex-start; gap:12px; width:100%;
  text-align:left; background:var(--soft);
  border:1.5px solid transparent; border-radius:12px;
  padding:13px 16px; cursor:pointer;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
.opt:hover{background:var(--blue-soft); border-color:var(--blue-soft-2)}
.opt.is-on{background:var(--blue); border-color:var(--blue); color:#fff}
.opt.is-on .opt-sub{color:rgba(255,255,255,.82)}
.opt.is-off{
  opacity:.45; cursor:not-allowed; background:var(--soft);
  border-color:transparent; color:var(--muted);
}
.opt.is-off:hover{background:var(--soft); border-color:transparent}

.mark{
  width:19px; height:19px; flex:none; margin-top:2px;
  border:2px solid var(--line-2); background:#fff; position:relative;
  transition:border-color .15s ease, background .15s ease;
}
.mark.radio{border-radius:50%}
.mark.check{border-radius:6px}
.opt:hover>.mark{border-color:var(--blue)}
.is-on>.mark{border-color:#fff; background:#fff}
.is-on>.mark.radio::after{
  content:""; position:absolute; inset:0; margin:auto;
  width:8px; height:8px; border-radius:50%; background:var(--blue);
}
.is-on>.mark.check::after{
  content:""; position:absolute; left:5px; top:2px;
  width:5px; height:9px; border:solid var(--blue); border-width:0 2.5px 2.5px 0;
  transform:rotate(43deg);
}
.opt-text{display:flex; flex-direction:column; gap:3px; min-width:0}
.opt-label{font-size:15px; font-weight:600; line-height:1.45}
.opt-sub{font-size:13.5px; font-weight:400; color:var(--muted); line-height:1.5}

.specify{
  margin:-2px 0 4px 31px; width:calc(100% - 31px);
  border:1.5px solid var(--line-2); border-radius:10px;
  padding:11px 14px; background:#fff; color:var(--ink);
}
.specify:focus{outline:none; border-color:var(--blue)}
.specify::placeholder{color:#9AA6BC}

.counter{margin:15px 0 0; font-size:13px; font-weight:500; color:var(--muted)}

/* ============================================================
   Matrix tables
   ============================================================ */
.mtx-wrap{width:100%}
.mtx{width:100%; table-layout:fixed}
.mtx thead th{
  padding:0 4px 12px; text-align:center; vertical-align:bottom;
  font-size:13px; font-weight:700; color:var(--ink-2);
}
.mtx thead th.corner{width:36%}
.th-l{display:block}
.th-a{display:block; margin-top:4px; font-size:11px; font-weight:500; color:var(--muted); line-height:1.3}
.mtx tbody th.rowhead{
  text-align:left; font-weight:600; font-size:14.5px; color:var(--ink-2);
  padding:12px 16px 12px 14px; line-height:1.45;
}
.mtx tbody tr{background:var(--soft)}
.mtx tbody tr:nth-child(even){background:var(--panel)}
.mtx tbody tr:hover{background:var(--blue-soft)}
.mtx tbody tr td:last-child,.mtx tbody tr th:first-child{border-radius:0}
.mtx tbody th.rowhead{border-radius:10px 0 0 10px}
.mtx tbody th.rowhead.is-empty{padding:0}
.mtx tbody td:last-child{border-radius:0 10px 10px 0}
.mtx tbody td{padding:5px 3px; text-align:center}

.cell{
  display:flex; align-items:center; justify-content:center;
  width:100%; min-height:38px; background:transparent;
  border:0; cursor:pointer; border-radius:8px; padding:6px 2px;
}
.cell>.mark{margin-top:0}
.cell:hover>.mark{border-color:var(--blue)}
.cell.is-off{opacity:.32; cursor:not-allowed}
.cell.is-off:hover>.mark{border-color:var(--line-2)}
.cell.is-on>.mark{border-color:var(--blue); background:var(--blue)}
.cell.is-on>.mark.radio::after{background:#fff}
.cell.is-on>.mark.check::after{border-color:#fff}
.cell-l{display:none}

/* ============================================================
   Text fields
   ============================================================ */
.stack{display:flex; flex-direction:column; gap:14px}
.tfield{display:flex; align-items:center; gap:12px}
.tfield-n{
  width:28px; height:28px; flex:none; border-radius:50%;
  background:var(--blue-soft); color:var(--blue-dark);
  display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:700;
}
.tfield input{
  flex:1; min-width:0; border:1.5px solid var(--line-2); border-radius:10px;
  padding:12px 14px; background:#fff; color:var(--ink); font-weight:500;
}
.tfield input:focus{outline:none; border-color:var(--blue)}
.tfield input::placeholder{color:#9AA6BC; font-weight:400}

/* ============================================================
   Concepts and heat map
   ============================================================ */
.concept{background:var(--soft); border-radius:12px; padding:24px 24px 18px}
.concept--tight{padding:20px}
.concept-title{
  font-size:11.5px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color:var(--blue); margin:0 0 14px; line-height:1.5;
}
.concept-title--plain{
  text-transform:none; letter-spacing:0; font-size:15.5px;
  font-weight:700; color:var(--ink);
}
.concept-body{
  font-size:15.5px; line-height:1.7; color:var(--ink-2);
  margin-bottom:20px; font-weight:500;
}
.concept-body b{color:var(--blue-dark); font-weight:700}
.concept .mtx tbody tr{background:transparent}
.concept .mtx tbody tr:nth-child(even){background:transparent}
.concept .mtx tbody tr:hover{background:var(--blue-soft)}

.ref{
  display:inline-block; margin:0 0 18px;
  background:var(--blue-soft); color:var(--blue-dark);
  border-radius:100px; padding:6px 14px;
  font-size:11.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
}

.hm{background:var(--soft); border-radius:12px; padding:24px 26px 22px}
.hm-title{
  margin:0 0 16px; font-size:11.5px; font-weight:800;
  letter-spacing:.08em; text-transform:uppercase; color:var(--blue);
}
.hm-text{margin:0; font-size:17px; line-height:2.05; color:var(--ink-2); font-weight:500}
.frag{
  display:inline; cursor:pointer; -webkit-tap-highlight-color:transparent;
  padding:2px 0; border-radius:4px; color:inherit;
  text-decoration:underline; text-decoration-style:dotted;
  text-decoration-thickness:1.5px; text-underline-offset:5px;
  text-decoration-color:var(--line-2);
  transition:background .14s ease, color .14s ease, text-decoration-color .14s ease;
}
.frag:hover{background:var(--blue-soft-2); text-decoration-color:var(--blue)}
.frag:focus-visible{outline:2px solid var(--blue); outline-offset:3px}
.frag.is-on{
  background:var(--blue); color:#fff; font-weight:600;
  box-shadow:0 0 0 3px var(--blue);
  text-decoration-color:rgba(255,255,255,.55); text-decoration-style:solid;
}
.glue{color:var(--ink-2)}

.sub-q{margin-top:26px; padding-top:24px; border-top:1.5px solid var(--line)}
.sub-q-title{margin:0 0 8px; font-size:15.5px; font-weight:700}
.sub-q-quote{
  margin:0 0 18px; font-size:15.5px; line-height:1.6; font-weight:600;
  color:var(--blue-dark); background:var(--blue-soft);
  padding:14px 16px; border-radius:10px;
}

/* ============================================================
   Intro, welcome, end
   ============================================================ */
.panel--intro{padding:40px 34px}
.intro-title{font-size:26px; font-weight:800; margin:0 0 12px; line-height:1.28; letter-spacing:-.02em}
.intro-lede{margin:0; color:var(--ink-2); font-size:16px; max-width:60ch; font-weight:500}
.intro-lede b{color:var(--blue-dark); font-weight:700}
.chipwrap{display:flex; flex-wrap:wrap; gap:7px; margin-top:20px}
.chip{
  background:var(--blue-soft); color:var(--blue-dark);
  border-radius:100px; padding:5px 13px; font-size:13px; font-weight:600;
}

.panel--welcome{padding:44px 36px 38px}
.welcome-title{font-size:32px; font-weight:800; margin:0 0 16px; line-height:1.2; letter-spacing:-.025em}
.welcome-lede{margin:0 0 14px; color:var(--ink-2); font-size:16px; max-width:60ch; font-weight:500}
.sections-box{margin:26px 0 28px; border-radius:12px; background:var(--soft); padding:20px 24px}
.sections-box-h{
  margin:0 0 12px; font-size:11.5px; font-weight:800;
  letter-spacing:.09em; text-transform:uppercase; color:var(--blue);
}
.sections-list{margin:0; padding-left:20px; columns:2; column-gap:28px}
.sections-list li{font-size:14.5px; font-weight:600; color:var(--ink-2); margin-bottom:6px; break-inside:avoid}

.panel--end{padding:46px 36px}
.end-title{font-size:28px; font-weight:800; margin:0 0 12px; line-height:1.25; letter-spacing:-.02em}
.end-lede{margin:0 0 28px; color:var(--ink-2); font-size:16px; max-width:56ch; font-weight:500}
.endrow{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px}

.btn{
  border-radius:10px; padding:13px 26px; cursor:pointer;
  border:0; font-size:15.5px; font-weight:700;
  transition:background .15s ease, box-shadow .15s ease;
}
.btn--primary{background:var(--blue); color:#fff; box-shadow:0 6px 18px -8px rgba(47,111,237,.9)}
.btn--primary:hover{background:var(--blue-dark)}
.btn--ghost{background:var(--soft); color:var(--ink-2); box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn--ghost:hover{box-shadow:inset 0 0 0 1.5px var(--blue); color:var(--blue)}
.btn--lg{padding:15px 34px; font-size:16px; width:100%; max-width:280px}

.linkish{
  display:block; margin-top:18px; background:none; border:0; padding:0;
  color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer;
  text-decoration:underline; text-underline-offset:3px;
}
.linkish:hover{color:var(--blue)}

:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:900px){
  .steps{display:none}
  .stepnow{
    display:block; max-width:1180px; margin:0 auto;
    padding:0 20px 11px; font-size:12.5px; font-weight:700; color:var(--blue);
  }
}

@media (max-width:719px){
  .chrome-top{padding:12px 18px 9px}
  .study{font-size:11px}
  .meta{font-size:12px; gap:10px; white-space:nowrap}
  .layout{padding:16px 12px 96px}
  .panel{padding:24px 20px 26px; border-radius:12px}
  .panel--intro,.panel--welcome,.panel--end{padding:30px 20px}
  .q-title{font-size:19px}
  .welcome-title{font-size:25px}
  .sections-list{columns:1}
  .opts--cols{grid-template-columns:1fr}
  .btn--lg{max-width:none}
  .hint{font-size:11.5px; padding:7px 15px}
  .navbtn--back{padding:10px 16px 10px 13px; font-size:14px}
  .navbtn--next{padding:12px 20px 12px 24px; font-size:15px}

  /* matrix collapses to one card per row */
  .mtx,.mtx tbody,.mtx tr{display:block; width:100%}
  .mtx thead{display:none}
  .mtx tbody tr,.mtx tbody tr:nth-child(even){
    background:var(--soft); border-radius:12px;
    padding:14px 14px 9px; margin-bottom:9px;
  }
  .mtx tbody tr:hover{background:var(--soft)}
  .mtx tbody th.rowhead{
    display:block; padding:0 0 11px; font-size:15px;
    font-weight:700; color:var(--ink); border-radius:0;
  }
  .mtx tbody td,.mtx tbody td:last-child{
    display:inline-block; width:auto; padding:0 6px 6px 0;
    text-align:left; border-radius:0;
  }
  .cell{
    display:inline-flex; width:auto; min-height:0; gap:8px;
    border-radius:100px; padding:8px 15px 8px 11px; background:var(--panel);
    box-shadow:inset 0 0 0 1.5px var(--line-2);
  }
  .cell.is-on{background:var(--blue); box-shadow:none}
  .cell.is-on>.mark{border-color:#fff; background:#fff}
  .cell.is-on>.mark.radio::after{background:var(--blue)}
  .cell.is-on>.mark.check::after{border-color:var(--blue)}
  .cell-l{display:inline; font-size:13.5px; font-weight:600; color:var(--ink-2)}
  .cell.is-on .cell-l{color:#fff}
  .mtx--scale tbody tr{display:flex; flex-wrap:wrap; align-items:center}
  .mtx--scale tbody th.rowhead{flex:0 0 100%}
  .mtx--scale tbody th.rowhead.is-empty{display:none}
  .mtx--scale tbody td,.mtx--scale tbody td:last-child{
    flex:1 1 0; min-width:0; display:block; padding:0 5px 5px 0;
  }
  .mtx--scale tbody td:last-child{padding-right:0}
  .mtx--scale .cell{
    width:100%; justify-content:center; gap:6px; padding:9px 4px;
  }
  .mtx--scale .cell>.mark{width:16px; height:16px}
  .mtx--scale .cell-l{font-size:13px}

  .hm-text{font-size:16px; line-height:2}
  .concept{padding:20px 18px 14px}
}

@media (max-width:560px){
  .study{display:none}
  .stepnow{padding-bottom:10px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header class="chrome" id="chrome" hidden>
  <div class="chrome-top">
    <span class="study">Snacks Questionnaire</span>
    <div class="meta">
      <span id="count"></span>
      <span class="pct" id="pct">0%</span>
    </div>
  </div>
  <div class="stepnow" id="stepnow"></div>
  <ol class="steps" id="steps"></ol>
  <div class="track"><div class="bar" id="bar"></div></div>
</header>

<div class="layout">
  <main class="stage" id="stage"></main>
</div>

<div class="navbar" id="navbar" hidden></div>
<button type="button" class="navbtn navbtn--back" id="back" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>

  function optionsOf(s) {
    return typeof s.options === 'function' ? s.options() : (s.options || []);
  }
  function optByValue(s, v) {
    var list = optionsOf(s), i;
    for (i = 0; i < list.length; i++) if (list[i].v === v) return list[i];
    return null;
  }

  function visible() {
    return SCREENS.filter(function (s) {
      if (s.type === 'welcome' || s.type === 'done') return false;
      if (typeof s.showIf === 'function') { try { return !!s.showIf(); } catch (e) { return false; } }
      return true;
    });
  }
  function questionScreens() {
    return visible().filter(function (s) { return s.num; });

  function requirement(s) {
    var a = A[s.id];
    switch (s.type) {
      case 'single': {
        if (!a || !a.value) return 'Please choose one option to continue.';
        var opt = optByValue(s, a.value);
        if (opt && opt.specify && !(a.other || '').trim()) return 'Please add a short description to continue.';
        return null;
      }
      case 'agree':
        return (a && a.value) ? null : 'Please choose one option to continue.';
      case 'multi': {
        var v = (a && a.values) || [];
        var min = s.min || 0, max = s.max || 99;
        var hasExclusive = v.some(function (x) {
          var o = optByValue(s, x); return !!(o && o.exclusive);
        });
        if (hasExclusive) return null;
        if (min === max && min > 0) {
          if (v.length < min) return 'Please select ' + min + '. ' + (min - v.length) + ' still to go.';
          return null;
        }
        if (v.length < min) return 'Please select at least ' + min + ' to continue.';
        return null;
      }
      case 'gridSingle': {
        var need = s.rows.length - Object.keys((a && a.map) || {}).length;
        return need > 0 ? need + ' row' + (need > 1 ? 's' : '') + ' still to answer.' : null;
      }
      case 'gridScale': {
        var n2 = s.rows.length - Object.keys((a && a.map) || {}).length;
        return n2 > 0 ? n2 + ' row' + (n2 > 1 ? 's' : '') + ' still to rate.' : null;
      }
      case 'gridMultiCol': {
        var m = (a && a.map) || {};
        var miss = s.rows.filter(function (r) {
          return !s.cols.some(function (c) { return (m[c.v] || []).indexOf(r) !== -1; });
        }).length;
        return miss > 0 ? miss + ' row' + (miss > 1 ? 's' : '') + ' still to answer.' : null;
      }
      case 'textList': {
        var f = (a && a.values) || [];
        var filled = f.filter(function (x) { return (x || '').trim(); }).length;
        return filled >= (s.requiredFields || 1) ? null : 'Please name at least one brand to continue.';
      }
      case 'conceptRate': {
        var left = CONCEPTS.length - Object.keys((a && a.map) || {}).length;
        return left > 0 ? left + ' idea' + (left > 1 ? 's' : '') + ' still to rate.' : null;
      }
      case 'heatmap': return null;
      case 'conceptEval': {
        var left2 = 4 - Object.keys((a && a.map) || {}).length;
        return left2 > 0 ? left2 + ' still to rate.' : null;
      }
      case 'blockRate': {
        var picks = ((A['Q31_' + s.block] || {}).values) || [];
        var m5 = (a && a.map) || {}, missing = 0;
        picks.forEach(function (p) {
          var r = m5[p] || {};
          if (!r.brand) missing++;
          if (!r.territory) missing++;
        });
        return missing > 0 ? missing + ' rating' + (missing > 1 ? 's' : '') + ' still to give.' : null;
      }
      default: return null;
    }
  }

  function buildSteps() {

  function optionRow(o, checked, disabled, kind, screenId) {
    var cls = 'opt' + (checked ? ' is-on' : '') + (disabled ? ' is-off' : '');
    var h = '<button type="button" class="' + cls + '" data-act="opt" data-v="' + esc(o.v) + '"' +
      (disabled ? ' aria-disabled="true"' : '') +
      ' role="' + (kind === 'radio' ? 'radio' : 'checkbox') + '" aria-checked="' + (checked ? 'true' : 'false') + '">' +
      '<span class="mark ' + kind + '"></span>' +
      '<span class="opt-text"><span class="opt-label">' + esc(o.l) + '</span>';
    if (o.sub) h += '<span class="opt-sub">' + esc(o.sub) + '</span>';
    h += '</span></button>';
    if (o.specify && checked) {
      h += '<input class="specify" data-act="specify" type="text" placeholder="Please specify" value="' +
        esc((A[screenId] && A[screenId].other) || '') + '" />';
    }
    return h;
  }

  function matrixTable(cfg) {
    var h = '<div class="mtx-wrap"><table class="mtx' + (cfg.cls ? ' ' + cfg.cls : '') +
      '"><thead><tr><th class="corner"></th>';
    cfg.cols.forEach(function (c) {
      h += '<th><span class="th-l">' + esc(c.l) + '</span>' +
        (c.anchor ? '<span class="th-a">' + esc(c.anchor) + '</span>' : '') + '</th>';
    });
    h += '</tr></thead><tbody>';
    cfg.rows.forEach(function (r) {
      h += '<tr><th scope="row" class="rowhead' + (r.l ? '' : ' is-empty') +
        '">' + esc(r.l) + '</th>';
      cfg.cols.forEach(function (c) {
        var on = cfg.isOn(r, c);
        var off = !on && cfg.isOff && cfg.isOff(r, c);
        h += '<td' + (on ? ' class="on"' : '') + '><button type="button" class="cell' + (on ? ' is-on' : '') +
          (off ? ' is-off' : '') +
          '" data-act="' + cfg.act + '" ' + (off ? 'aria-disabled="true" ' : '') + cfg.data(r, c) +
          ' role="' + (cfg.kind === 'check' ? 'checkbox' : 'radio') + '" aria-checked="' + (on ? 'true' : 'false') +
          '" aria-label="' + esc((r.aria || r.l) + ': ' + c.l) + '">' +
          '<span class="mark ' + (cfg.kind === 'check' ? 'check' : 'radio') + '"></span>' +
          '<span class="cell-l">' + esc(c.l) + '</span></button></td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function scaleCols(low, high) {

  }

  function render() {
    var vis = visible();
    var s;

    if (STATE.phase === 'welcome') { renderWelcome(); return; }
    if (STATE.phase === 'terminated') { renderTerminated(); return; }
    if (STATE.phase === 'done') { renderDone(); return; }

    if (STATE.i >= vis.length) { STATE.phase = 'done'; render(); return; }
    s = vis[STATE.i];

    elChrome.hidden = false;
    showNav(true);

    var pct = vis.length > 1 ? Math.round((STATE.i / (vis.length - 1)) * 100) : 0;
    elBar.style.width = pct + '%';
    elPct.textContent = pct + '%';

    var qs = questionScreens();
    var qIndex = s.num ? qs.indexOf(s) + 1 : 0;
    elCount.textContent = qIndex ? 'Question ' + qIndex + ' of ' + qs.length : '';

    Array.prototype.forEach.call(elSteps.children, function (li) {
      var n = parseInt(li.getAttribute('data-sec'), 10);
      li.className = 'step' + (n === s.sec ? ' is-now' : (n < s.sec ? ' is-done' : ''));
    });
    elStepNow.textContent = 'Section ' + s.sec + ' of 6: ' + SECTION_NAMES[s.sec];

    var body;
    if (s.type === 'intro') {
      body = '<section class="panel panel--intro">' +
        '<p class="kicker">' + esc(s.kicker) + '</p>' +
        '<h2 class="intro-title">' + esc(s.title) + '</h2>' +
        (s.lede ? '<p class="intro-lede">' + esc(s.lede) + '</p>' : '') + '</section>';
    } else if (s.type === 'reveal') {
      body = '<section class="panel panel--intro">' +
        '<p class="kicker">Please read before continuing</p>' +
        '<h2 class="intro-title">One single family</h2>' +
        '<p class="intro-lede">From now on, please imagine that all of these products belong to one single family: <b>MARINELA</b>.</p>' +
        '<div class="chipwrap">' + MARINELA_BRANDS.map(function (b) {
          return '<span class="chip">' + esc(b) + '</span>';
        }).join('') + '</div></section>';
    } else {
      body = '<section class="panel">' + head(s) + fieldFor(s) + '</section>';
    }
    elStage.innerHTML = body;
    if (LAST !== s.id) {
      LAST = s.id;
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    elBack.disabled = STATE.i === 0;
    var req = s.num ? requirement(s) : null;
    elNext.disabled = !!req;
    elNextLbl.textContent = (STATE.i === vis.length - 1) ? 'Submit' : 'Next';
    elHint.textContent = NOTE || req || '';
    elHint.classList.toggle('is-on', !!(NOTE || req));
    save();
  }

  function head(s) {
    var h = '<header class="q-head">';
    if (s.num) h += '<span class="q-num">' + esc(s.num) + '</span>';
    h += '<h2 class="q-title">' + esc(s.title) + '</h2>';
    if (s.note) h += '<p class="q-note">' + esc(s.note) + '</p>';
    return h + '</header>';
  }

  function fieldFor(s) {
    var a = A[s.id] || {};
    var h = '';

    if (s.type === 'single') {
      h += '<div class="opts' + (s.tribes ? ' opts--stacked' : '') + '" role="radiogroup">';
      optionsOf(s).forEach(function (o) {
        h += optionRow(o, a.value === o.v, false, 'radio', s.id);
      });
      return h + '</div>';
    }

    if (s.type === 'agree') {
      h += '<p class="sub-q-quote">\u201c' + esc(s.quote) + '\u201d</p><div class="opts" role="radiogroup">';
      AGREE_5.forEach(function (l) {
        h += optionRow({ v: l, l: l }, a.value === l, false, 'radio', s.id);
      });
      return h + '</div>';
    }

    if (s.type === 'multi') {
      var all = optionsOf(s);
      if (a.values && typeof s.options === 'function') {
        a.values = a.values.filter(function (v) { return !!optByValue(s, v); });
      }
      var vals = a.values || [];
      var exclusiveOn = vals.some(function (v) {
        var o = optByValue(s, v); return !!(o && o.exclusive);
      });
      var atMax = !!(s.max && vals.length >= s.max);

      h += '<div class="opts' + (s.columns ? ' opts--cols' : '') + '" role="group">';
      all.forEach(function (o) {
        var checked = vals.indexOf(o.v) !== -1;
        var disabled = false;
        if (!checked) {
          if (o.exclusive) disabled = false;
          else disabled = exclusiveOn || atMax;
        }
        h += optionRow(o, checked, disabled, 'check', s.id);
      });
      h += '</div>';

      var msg = '';
      if (exclusiveOn) {
        msg = 'The other options are switched off while this is selected.';
      } else if (s.max && s.max < 90) {
        msg = vals.length + ' of ' + s.max + ' selected';
        if (atMax) msg += '. Deselect one to change your answer.';
      }
      if (msg) h += '<p class="counter">' + esc(msg) + '</p>';
      return h;
    }

    if (s.type === 'gridSingle') {
      var map = a.map || {};
      return matrixTable({
        kind: 'radio', act: 'grid',
        rows: s.rows.map(function (r) { return { l: r }; }),
        cols: s.cols(),
        isOn: function (r, c) { return map[r.l] === c.v; },
        data: function (r, c) { return 'data-r="' + esc(r.l) + '" data-v="' + esc(c.v) + '"'; }
      });
    }

    if (s.type === 'gridScale') {
      var m = a.map || {};
      return matrixTable({
        kind: 'radio', act: 'gscale', cls: 'mtx--scale',
        rows: s.rows.map(function (r) { return { l: r }; }),
        cols: scaleCols(s.lowLabel, s.highLabel),
        isOn: function (r, c) { return m[r.l] === c.v; },
        data: function (r, c) { return 'data-r="' + esc(r.l) + '" data-n="' + c.v + '"'; }
      });
    }

    if (s.type === 'gridMultiCol') {
      var mm = a.map || {};
      var rowHas = function (rl, pred) {
        return s.cols.some(function (c) {
          if (pred && !pred(c)) return false;
          return (mm[c.v] || []).indexOf(rl) !== -1;
        });
      };
      return matrixTable({
        kind: 'check', act: 'gmc',
        rows: s.rows.map(function (r) { return { l: r }; }),
        cols: s.cols,
        isOn: function (r, c) { return (mm[c.v] || []).indexOf(r.l) !== -1; },
        isOff: function (r, c) {
          if ((mm[c.v] || []).indexOf(r.l) !== -1) return false;
          if (c.exclusive) return rowHas(r.l, function (x) { return !x.exclusive; });
          return rowHas(r.l, function (x) { return !!x.exclusive; });
        },
        data: function (r, c) { return 'data-r="' + esc(r.l) + '" data-v="' + esc(c.v) + '"'; }
      });
    }

    if (s.type === 'textList') {
      var vv = a.values || [];
      h += '<div class="stack">';
      for (var i = 0; i < s.fields; i++) {
        h += '<label class="tfield"><span class="tfield-n">' + (i + 1) + '</span>' +
          '<input type="text" data-act="text" data-i="' + i + '" value="' + esc(vv[i] || '') +
          '" placeholder="' + (i === 0 ? 'Brand name' : 'Optional') + '" /></label>';
      }
      return h + '</div>';
    }

    if (s.type === 'conceptRate') {
      var cm = a.map || {};
      h += '<div class="stack">';
      CONCEPTS.forEach(function (c) {
        h += '<article class="concept"><h3 class="concept-title">' + esc(c.title) + '</h3>' +
          '<div class="concept-body">' + c.body + '</div>' +
          matrixTable({
            kind: 'radio', act: 'crate', cls: 'mtx--scale',
            rows: [{ l: '', aria: c.title }],
            cols: scaleCols(s.lowLabel, s.highLabel),
            isOn: function (r, cc) { return cm[c.code] === cc.v; },
            data: function (r, cc) { return 'data-c="' + c.code + '" data-n="' + cc.v + '"'; }
          }) + '</article>';
      });
      return h + '</div>';
    }

    if (s.type === 'heatmap') {
      var c2 = conceptByCode(s.concept);
      var sel = a.values || [];
      h += '<div class="hm"><p class="hm-title">' + esc(c2.hmTitle) + '</p><p class="hm-text">';
      c2.fragments.forEach(function (f, i) {
        h += '<span class="frag' + (sel.indexOf(i) !== -1 ? ' is-on' : '') +
          '" data-act="frag" data-i="' + i + '" role="checkbox" tabindex="0" aria-checked="' +
          (sel.indexOf(i) !== -1 ? 'true' : 'false') + '">' + esc(f) + '</span>';
        var g = (c2.glue && c2.glue[i] !== undefined) ? c2.glue[i] : ' ';
        if (g) h += '<span class="glue">' + esc(g) + '</span>';
      });
      h += '</p></div><p class="counter">' + sel.length + ' phrase' + (sel.length === 1 ? '' : 's') + ' selected</p>';
      return h;
    }

    if (s.type === 'conceptEval') {
      var c3 = conceptByCode(s.concept);
      var em = a.map || {};
      h += '<p class="ref">' + esc(c3.hmTitle) + '</p>';
      return h + matrixTable({
        kind: 'radio', act: 'eval', cls: 'mtx--scale',
        rows: [
          { l: 'Connects with me', k: 'connects' },
          { l: 'Fits with Marinela', k: 'fits' },
          { l: 'Feels different from other brands I know', k: 'different' },
          { l: 'Feels credible for Marinela', k: 'credible' }
        ],
        cols: scaleCols('Not important at all', 'Very important'),
        isOn: function (r, c) { return em[r.k] === c.v; },
        data: function (r, c) { return 'data-k="' + r.k + '" data-n="' + c.v + '"'; }
      });
    }

    if (s.type === 'blockRate') {
      var picks = ((A['Q31_' + s.block] || {}).values) || [];
      var rm = a.map || {};
      var wt = winningTerritory();
      h += '<div class="stack">';
      picks.forEach(function (p) {
        var r = rm[p] || {};
        h += '<article class="concept concept--tight"><h3 class="concept-title concept-title--plain">' +
          esc(p) + '</h3>' +
          matrixTable({
            kind: 'radio', act: 'brate', cls: 'mtx--scale',
            rows: [
              { l: 'How well does this fit Marinela as a brand?', k: 'brand' },
              { l: 'How well does this fit \u201c' + (wt ? wt.label : 'the idea you selected in Q30') + '\u201d?', k: 'territory' }
            ],
            cols: scaleCols(s.lowLabel, s.highLabel),
            isOn: function (row, c) { return r[row.k] === c.v; },
            data: function (row, c) { return 'data-p="' + esc(p) + '" data-k="' + row.k + '" data-n="' + c.v + '"'; }
          }) + '</article>';
      });
      return h + '</div>';
    }

    return h;
  }

  function renderWelcome() {
    elChrome.hidden = true;
    showNav(false);
    elStage.innerHTML =
      '<section class="panel panel--welcome">' +
      '<p class="kicker">Consumer research study</p>' +
      '<h1 class="welcome-title">Snacks questionnaire</h1>' +
      '<p class="welcome-lede">Thank you for agreeing to take part. This survey asks about the sweet snacks you buy and eat, and about a few brand ideas we would like your opinion on. There are no right or wrong answers; we simply want to know what you think.</p>' +
      '<p class="welcome-lede">Your responses are anonymous and will be used exclusively for research purposes.</p>' +
      '<div class="sections-box"><p class="sections-box-h">The survey has 6 sections</p><ol class="sections-list">' +
      '<li>Profile and screening</li><li>Habits and consumption moments</li><li>Territory evaluation</li>' +
      '<li>Brand perception</li><li>The brand beyond what it is today</li><li>Tribe identification</li>' +
      '</ol></div>' +
      '<button type="button" class="btn btn--primary btn--lg" id="start">Begin survey</button>' +
      '</section>';
    document.getElementById('start').addEventListener('click', function () {
      STATE.phase = 'run'; STATE.i = 0; STATE.startedAt = new Date().toISOString(); render();
    });
  }

  function renderTerminated() {
    elChrome.hidden = true;
    showNav(false);
    submitToSheet();
    elStage.innerHTML =
      '<section class="panel panel--end">' +
      '<p class="kicker">Survey closed</p>' +
      '<h2 class="end-title">Thank you for your time</h2>' +
      '<p class="end-lede">Based on your answers, this study is not a match for you right now. We are grateful that you got in touch, and we hope to reach you with the next one.</p>' +
      '<button type="button" class="btn btn--ghost" id="restart">Start again</button></section>';
    document.getElementById('restart').addEventListener('click', reset);
  }

  function renderDone() {
    elChrome.hidden = true;
    showNav(false);
    submitToSheet();
    elStage.innerHTML =
      '<section class="panel panel--end">' +
      '<p class="kicker">Response submitted</p>' +
      '<h2 class="end-title">Thank you for your participation!</h2>' +
      '<p class="end-lede">Your responses are anonymous and will be used exclusively for research purposes.</p>' +
      '<button type="button" class="linkish" id="restart2">Start a new response</button></section>';
    document.getElementById('restart2').addEventListener('click', reset);
  }

  function reset() {
    Object.keys(A).forEach(function (k) { delete A[k]; });
    STATE.i = 0; STATE.terminated = null; STATE.phase = 'welcome'; STATE.startedAt = null;
    LAST = null; NOTE = null;
    SUBMITTED = false;
    clear();
    render();
  }

  /* ============================================================
     Google Sheets submission
     Paste the deployed Apps Script Web App URL below (ends in /exec).
     ============================================================ */
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwv5hqboVoMLgGKXz4ninms-RZ8becQPQjMSf9Lv-IF-IFclzC8jVVayiozNISRVE5c/exec';
  var SUBMITTED = false;

  function answerText_(s, a) {
    if (!a) return '';
    if (s.type === 'heatmap') {
      return (a.values || []).map(function (i) {
        return conceptByCode(s.concept).fragments[i];
      }).join(' | ');
    }
    if (a.value !== undefined) {
      var opt = optByValue(s, a.value);
      var lbl = opt ? opt.l : a.value;
      return a.other ? (lbl + ' (' + a.other + ')') : String(lbl);
    }
    if (a.values !== undefined) {
      var labels = (a.values || []).map(function (v) {
        var o = optByValue(s, v);
        return o ? o.l : v;
      });
      return a.other ? labels.concat([a.other]).join(' | ') : labels.join(' | ');
    }
    if (a.map !== undefined) {
      return Object.keys(a.map).map(function (k) {
        var x = a.map[k];
        if (x && typeof x === 'object' && !Array.isArray(x)) {
          return k + '=' + Object.keys(x).map(function (z) { return z + ':' + x[z]; }).join('/');
        }
        return k + '=' + (Array.isArray(x) ? x.join('/') : x);
      }).join(' | ');
    }
    return '';
  }

  /* Flat, one-key-per-question payload for the Google Sheet.
     Keys are "Q<n> - <question text>" so the sheet header is self-explanatory. */
  function flatPayload() {
    var out = {
      'Study': 'Marinela Brandverse, Marinela questionnaire, USA',
      'Started At': STATE.startedAt || '',
      'Completed At': new Date().toISOString(),
      'Status': STATE.terminated ? 'terminated' : 'complete',
      'Terminated At': STATE.terminated || ''
    };
    var onPath = {};
    visible().forEach(function (s) { onPath[s.id] = true; });
    SCREENS.forEach(function (s) {
      if (!s.num || !onPath[s.id]) return;
      var a = A[s.id];
      if (!a) return;
      var key = s.num + ' - ' + s.title;
      out[key] = answerText_(s, a);
    });
    return out;
  }

  function submitToSheet() {
    if (SUBMITTED) return;
    if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE') !== -1) {
      console.warn('SCRIPT_URL is not set — response was not sent to Google Sheets.');
      return;
    }
    SUBMITTED = true;
    try {
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(flatPayload())
      }).catch(function (err) {
        console.error('Survey submission failed:', err);
        SUBMITTED = false;
      });
    } catch (err) {
      console.error('Survey submission failed:', err);
      SUBMITTED = false;
    }
  }

  function payload() {
    var out = {
      study: 'Marinela Brandverse, Marinela questionnaire, USA',
      startedAt: STATE.startedAt,
      completedAt: new Date().toISOString(),
      status: STATE.terminated ? 'terminated' : 'complete',
      terminatedAt: STATE.terminated,
      randomisation: RND,
      categories: cats(),
      answers: {}
    };
    var onPath = {};
    visible().forEach(function (s) { onPath[s.id] = true; });
    SCREENS.forEach(function (s) {
      if (!s.num || !onPath[s.id]) return;
      var a = A[s.id];
      if (!a) return;
      var rec = { question: s.title };
      if (a.value !== undefined) rec.value = a.value;
      if (a.values !== undefined) rec.values = a.values;
      if (a.map !== undefined) rec.map = a.map;
      if (a.other) rec.other = a.other;
      if (s.type === 'heatmap') {
        rec.phrases = (a.values || []).map(function (i) { return conceptByCode(s.concept).fragments[i]; });
      }
      if (s.concept) rec.concept = s.concept;
      if (s.block) rec.block = s.block;
      out.answers[s.num] = rec;
    });
    return out;
  }
  function toCSV(p) {
    var rows = [];
    rows.push(['status', p.status]);
    rows.push(['startedAt', p.startedAt || '']);
    rows.push(['completedAt', p.completedAt]);
    Object.keys(p.answers).forEach(function (k) {
      var r = p.answers[k], v;
      if (r.value !== undefined) v = r.value;
      else if (r.values !== undefined) v = (r.phrases || r.values).join(' | ');
      else if (r.map !== undefined) v = Object.keys(r.map).map(function (kk) {
        var x = r.map[kk];
        if (x && typeof x === 'object' && !Array.isArray(x)) {
          return kk + '=' + Object.keys(x).map(function (z) { return z + ':' + x[z]; }).join('/');
        }
        return kk + '=' + (Array.isArray(x) ? x.join('/') : x);
      }).join(' | ');
      else v = '';
      rows.push([k, v]);
      if (r.other) rows.push([k + '_other', r.other]);
    });
    var q = function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; };
    return [['field', 'value'].map(q).join(',')]
      .concat(rows.map(function (r) { return r.map(q).join(','); })).join('\n');
  }
  function download(name, text, mime) {
    try {
      var blob = new Blob([text], { type: mime + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    } catch (e) { /* download not available here */ }
  }

  var STORE = (typeof window !== 'undefined' && window.storage) ? window.storage : null;
  var saveTimer = null;
  function save() {
    if (!STORE) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        STORE.set('marinela:draft', JSON.stringify({ A: A, i: STATE.i, phase: STATE.phase, startedAt: STATE.startedAt, rnd: RND }))
          .catch(function () {});
      } catch (e) { /* ignore */ }
    }, 400);
  }
  function clear() {
    if (!STORE) return;
    try { STORE.delete('marinela:draft').catch(function () {}); } catch (e) { /* ignore */ }
  }

  function current() { return visible()[STATE.i]; }

  function note(msg) {
    NOTE = msg;
    elHint.textContent = msg;
    elHint.classList.add('is-on');
    setTimeout(function () {
      if (NOTE === msg) { NOTE = null; render(); }
    }, 2400);
  }

  elStage.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!t) return;
    var s = current();
    if (!s) return;
    var act = t.getAttribute('data-act');

    if (t.classList.contains('is-off')) {
      note('Deselect one of your current answers to change this.');
      return;
    }

    var a = A[s.id] || (A[s.id] = {});

    if (act === 'opt') {
      var v = t.getAttribute('data-v');
      if (s.type === 'single' || s.type === 'agree') {
        a.value = v;
        var o = optByValue(s, v);
        if (s.type === 'agree' || !o || !o.specify) delete a.other;
      } else {
        a.values = a.values || [];
        var opt = optByValue(s, v);
        var idx = a.values.indexOf(v);
        if (idx !== -1) {
          a.values.splice(idx, 1);
          if (opt && opt.specify) delete a.other;
        } else if (opt && opt.exclusive) {
          a.values = [v];
        } else {
          a.values.push(v);
        }
      }
      return draw();
    }

    if (act === 'grid') {
      a.map = a.map || {};
      a.map[t.getAttribute('data-r')] = t.getAttribute('data-v');
      return draw();
    }
    if (act === 'gmc') {
      a.map = a.map || {};
      var col = t.getAttribute('data-v'), row = t.getAttribute('data-r');
      a.map[col] = a.map[col] || [];
      var k = a.map[col].indexOf(row);
      if (k === -1) {
        var colDef = null;
        (s.cols || []).forEach(function (c) { if (c.v === col) colDef = c; });
        (s.cols || []).forEach(function (c) {
          if (c.v === col) return;
          if ((colDef && colDef.exclusive) || c.exclusive) {
            var arr = a.map[c.v] || [];
            var j = arr.indexOf(row);
            if (j !== -1) arr.splice(j, 1);
          }
        });
        a.map[col].push(row);
      } else {
        a.map[col].splice(k, 1);
      }
      return draw();
    }
    if (act === 'gscale') {
      a.map = a.map || {};
      a.map[t.getAttribute('data-r')] = parseInt(t.getAttribute('data-n'), 10);
      return draw();
    }
    if (act === 'crate') {
      a.map = a.map || {};
      a.map[t.getAttribute('data-c')] = parseInt(t.getAttribute('data-n'), 10);
      return draw();
    }
    if (act === 'eval') {
      a.map = a.map || {};
      a.map[t.getAttribute('data-k')] = parseInt(t.getAttribute('data-n'), 10);
      return draw();
    }
    if (act === 'brate') {
      a.map = a.map || {};
      var p = t.getAttribute('data-p');
      a.map[p] = a.map[p] || {};
      a.map[p][t.getAttribute('data-k')] = parseInt(t.getAttribute('data-n'), 10);
      return draw();
    }
    if (act === 'frag') {
      a.values = a.values || [];
      var fi = parseInt(t.getAttribute('data-i'), 10);
      var pos = a.values.indexOf(fi);
      if (pos === -1) a.values.push(fi); else a.values.splice(pos, 1);
      return draw();
    }
  });

  elStage.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var t = ev.target.closest ? ev.target.closest('[data-act="frag"]') : null;
    if (!t) return;
    ev.preventDefault();
    ev.stopPropagation();
    t.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  });

  elStage.addEventListener('input', function (ev) {
    var t = ev.target;
    if (!t.getAttribute) return;
    var act = t.getAttribute('data-act');
    if (act !== 'text' && act !== 'specify') return;
    var s = current(); if (!s) return;
    var a = A[s.id] || (A[s.id] = {});
    if (act === 'specify') a.other = t.value;
    else {
      a.values = a.values || [];
      a.values[parseInt(t.getAttribute('data-i'), 10)] = t.value;
    }
    var req = requirement(s);
    elNext.disabled = !!req;
    elHint.textContent = req || '';
    elHint.classList.toggle('is-on', !!req);
    save();
  });

  function draw() {
    render();
    var s = current();
    if (s) autoAdvance(s);
  }

  var advTimer = null;
  function autoAdvance(s) {
    if (advTimer) clearTimeout(advTimer);
    if (s.type !== 'single' && s.type !== 'agree') return;
    var a = A[s.id];
    if (!a || !a.value) return;
    if (s.type === 'single') {
      var o = optByValue(s, a.value);
      if (o && o.specify) return;
    }
    advTimer = setTimeout(next, 340);
  }

  function next() {
    var vis = visible();
    var s = vis[STATE.i];
    if (!s) return;
    if (s.num && requirement(s)) return;

    if (typeof s.terminate === 'function') {
      var a = A[s.id] || {};
      if (s.terminate(a.value)) {
        STATE.terminated = s.num;
        STATE.phase = 'terminated';
        render();
        return;
      }
    }
    var after = visible();
    var pos = after.indexOf(s);
    if (pos === -1) pos = Math.min(STATE.i, after.length - 1);
    if (pos >= after.length - 1) { STATE.phase = 'done'; render(); return; }
    STATE.i = pos + 1;
    render();
  }

  function back() {
    if (STATE.i === 0) return;
    STATE.i -= 1;
    render();
  }

  elNext.addEventListener('click', next);
  elBack.addEventListener('click', back);

  document.addEventListener('keydown', function (e) {
    if (STATE.phase !== 'run') return;
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.key !== 'Enter') return;
    if (e.key === 'Enter') { if (!elNext.disabled) { e.preventDefault(); next(); } }
  });

  buildSteps();
  render();
})();

</script>
</body>
