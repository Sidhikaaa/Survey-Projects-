<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aerospace Export Procurement Audit — Buyer-Side Decision Makers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --purple-900:#3b2769;--purple-800:#4a327f;--purple-700:#5b3ea0;--purple-600:#6f4bc4;
  --purple-500:#8a63de;--purple-300:#b79ef0;--purple-200:#d8c9f7;--purple-100:#ece4fb;--purple-50:#f6f2fc;
  --teal:#1f9e8f;--blue:#2f7dbd;--coral:#d97a9a;
  --page:#f4f1f9;--card:#fff;
  --ink:#2b2440;--ink-soft:#7a7290;--ink-faint:#a49cba;
  --line:#eae4f4;--line-soft:#f2eef9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--page);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv05" 1}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ============ TOPBAR ============ */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:0;
  height:72px;background:linear-gradient(90deg,var(--purple-900),var(--purple-800) 60%,#553a92);
  border-bottom:1px solid rgba(0,0,0,.14);padding:0 24px}
.brand{font-size:14px;font-weight:700;letter-spacing:.14em;color:#fff;white-space:nowrap}
.divider{width:1px;height:26px;background:rgba(255,255,255,.22);margin:0 20px}
.tagline{font-size:13px;font-weight:400;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.005em}
.filters{margin-left:auto;display:flex;align-items:center;gap:8px}
.filters select{appearance:none;font-family:inherit;font-size:12.5px;font-weight:500;color:#fff;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:2px;
  padding:8px 28px 8px 12px;cursor:pointer;outline:none;transition:background .15s;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M1 1.2l3.5 3.5L8 1.2' stroke='rgba(255,255,255,0.65)' stroke-width='1.3' fill='none' stroke-linecap='square'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center}
.filters select:hover{background-color:rgba(255,255,255,.16)}
.filters select option{color:#2b2440;background:#fff}
.npill{font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.24);border-radius:2px;padding:8px 14px;white-space:nowrap;
  font-variant-numeric:tabular-nums;margin-left:6px}

/* ============ LAYOUT ============ */
.shell{display:flex;align-items:flex-start}
.side{width:274px;flex:none;background:#fff;border-right:1px solid var(--line);
  padding:24px 18px 40px;position:sticky;top:72px;height:calc(100vh - 72px);overflow-y:auto}
.side::-webkit-scrollbar{width:5px}.side::-webkit-scrollbar-thumb{background:var(--purple-200)}
.sidelbl{font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--ink-faint);
  margin-bottom:12px;padding-left:2px}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 11px;cursor:pointer;margin-bottom:2px;
  border-left:2px solid transparent;transition:background .14s,border-color .14s}
.navitem:hover{background:var(--purple-50)}
.navitem.on{background:var(--purple-50);border-left-color:var(--purple-700)}
.navno{width:24px;height:24px;flex:none;border:1px solid var(--line);background:#fff;
  color:var(--ink-faint);font-size:10.5px;font-weight:600;display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.navitem.on .navno{background:var(--purple-700);border-color:var(--purple-700);color:#fff}
.navtxt{font-size:13.5px;font-weight:500;color:var(--ink-soft);line-height:1.3;flex:1;letter-spacing:-.005em}
.navitem.on .navtxt{color:var(--purple-800);font-weight:600}
.badge{font-size:11px;font-weight:500;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.snapwrap{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
.snap{border:1px solid var(--line);padding:13px 14px;margin-bottom:8px;background:#fff}
.snap .l{font-size:9.5px;font-weight:600;letter-spacing:.12em;color:var(--ink-faint);margin-bottom:7px}
.snap .v{font-size:25px;font-weight:700;color:var(--purple-800);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pbar{height:3px;background:var(--purple-100);margin-top:11px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--purple-600);transition:width .8s cubic-bezier(.4,0,.2,1)}

.main{flex:1;padding:30px 32px 70px;min-width:0}
.page{display:none}.page.on{display:block;animation:fadeUp .38s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.17em;color:var(--purple-600);margin-bottom:9px}
.sec-title{font-size:27px;font-weight:700;letter-spacing:-.028em;margin-bottom:8px;line-height:1.15}
.sec-sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px;max-width:960px;line-height:1.62}

/* ============ KPI ============ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:24px;
  background:var(--line);border:1px solid var(--line)}
.kpi{background:#fff;padding:20px 21px 17px}
.kpi .v{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.035em;margin-bottom:12px;
  font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.kpi .t{font-size:13.5px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--ink-soft);line-height:1.45}
.kpi .d{font-size:11px;font-weight:600;letter-spacing:.02em;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:5px;color:var(--ink-soft);text-transform:uppercase}
.kpi .d svg{flex:none}
.c-p{color:var(--purple-700)}.c-d{color:var(--purple-900)}.c-t{color:var(--teal)}.c-m{color:var(--ink-faint)}

/* ============ PANELS ============ */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1460px){.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
.panel{background:#fff;border:1px solid var(--line);padding:17px 17px 13px;display:flex;flex-direction:column}
.ph{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.qn{min-width:23px;height:19px;padding:0 5px;flex:none;background:var(--purple-50);border:1px solid var(--purple-100);
  color:var(--purple-700);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;letter-spacing:.03em;margin-top:2px}
.qtx{font-size:14px;font-weight:600;line-height:1.4;letter-spacing:-.012em;flex:1}
.psub{font-size:12.5px;color:var(--ink-soft);margin-bottom:13px;line-height:1.5;padding-left:33px}
.cbox{position:relative;height:230px;margin-bottom:11px}
.fnote{font-size:10.5px;font-weight:500;color:var(--ink-faint);border-top:1px solid var(--line-soft);
  padding-top:9px;margin-top:auto;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.mtag{font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--purple-700);border:1px solid var(--purple-200);
  padding:3px 6px;flex:none;margin-top:2px;white-space:nowrap}

/* ============ MASKING ============ */
.cbox.masked canvas{filter:blur(8px) saturate(.55);opacity:.85}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.32);cursor:help}
.lockchip{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  color:var(--ink-soft);font-size:11px;font-weight:600;letter-spacing:.07em;padding:8px 13px;
  box-shadow:0 1px 6px rgba(59,39,105,.09)}
.lockchip svg{flex:none;color:var(--purple-700)}
.conf-note{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1px solid var(--line);
  border-left:2px solid var(--purple-600);padding:13px 17px;margin-bottom:20px;
  font-size:12.5px;color:var(--ink-soft);max-width:900px;line-height:1.6}
.conf-note svg{flex:none;margin-top:1px;color:var(--purple-700)}
.conf-note b{color:var(--ink);font-weight:600}
.blur{display:inline-block;background:var(--purple-100);color:var(--purple-800);font-weight:600;
  padding:0 8px;filter:blur(4.5px);user-select:none;cursor:help}

/* ============ RECOMMENDATIONS ============ */
.recgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:24px}
@media(max-width:1460px){.recgrid{grid-template-columns:1fr}}
.rec{background:#fff;border:1px solid var(--line);border-top:2px solid var(--purple-700);padding:24px 26px 20px}
.rtag{display:flex;align-items:center;gap:9px;font-size:9.5px;font-weight:600;letter-spacing:.15em;
  color:var(--ink-faint);margin-bottom:14px}
.rtag i{display:block;width:20px;height:1px;background:var(--purple-300)}
.rec h3{font-size:18px;font-weight:700;letter-spacing:-.024em;margin-bottom:11px;line-height:1.32}
.rec p{font-size:13.5px;color:var(--ink-soft);line-height:1.68;margin-bottom:16px}
.rec ul{list-style:none}
.rec li{font-size:12.5px;line-height:1.62;padding:9px 0 9px 22px;border-top:1px solid var(--line-soft);
  position:relative;color:var(--ink)}
.rec li:before{content:'';position:absolute;left:4px;top:17px;width:7px;height:1px;background:var(--purple-300)}
.evcap{font-size:12.5px;color:var(--ink-soft);margin:2px 0 16px;line-height:1.6;max-width:900px}
.foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;
  color:var(--ink-faint);line-height:1.7;max-width:1000px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tagline">Aerospace Export Procurement Audit &nbsp;·&nbsp; Buyer-Side Decision Makers &nbsp;·&nbsp; India, Greece, Peru</div>
  <div class="filters">
    <select id="f_market"><option value="ALL">All Markets</option></select>
    <select id="f_desig"><option value="ALL">All Designations</option></select>
    <select id="f_org"><option value="ALL">All Org Types</option></select>
    <select id="f_seg"><option value="ALL">All Segments</option></select>
    <span class="npill" id="npill">n = 100</span>
  </div>
</div>

<div class="shell">
  <aside class="side">
    <div class="sidelbl">CONTENTS</div>
    <div id="nav"></div>
    <div class="snapwrap">
      <div class="sidelbl">LIVE SAMPLE SNAPSHOT</div>
      <div class="snap"><div class="l">RESPONDENTS IN VIEW</div><div class="v" id="s1">100</div><div class="pbar"><i id="b1" style="width:100%"></i></div></div>
      <div class="snap"><div class="l">MARKETS REPRESENTED</div><div class="v" id="s2">3</div><div class="pbar"><i id="b2" style="width:100%"></i></div></div>
      <div class="snap"><div class="l">SUSTAINMENT PRIORITY INDEX</div><div class="v" id="s3">87</div><div class="pbar"><i id="b3" style="width:87%"></i></div></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ==========================================================================
   1. DATABASE — one row per respondent (n = 100)
   ========================================================================== */
const DB=(()=>{
  let s=20260806;
  const rnd=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296};
  const clamp=(v,lo=0,hi=100)=>Math.max(lo,Math.min(hi,v));
  const jit=(m,sd=6)=>clamp(Math.round(m+(rnd()+rnd()+rnd()-1.5)*sd));
  const pickW=o=>{const t=Object.values(o).reduce((a,b)=>a+b,0);let r=rnd()*t;
    for(const k in o){r-=o[k];if(r<=0)return k}return Object.keys(o)[0]};

  const MARKETS={'India':45,'Greece':32,'Peru':23};
  const DESIGS=['Designation A','Designation B','Designation C','Designation D',
                'Designation E','Designation F','Designation G','Designation H'];
  const ORGS={'Service Headquarters':34,'Ministry & Policy':22,'State OEM & Industry':26,'Partner & Integrator':18};
  const SEGS={'Fast Jet':22,'Rotary':26,'Transport & Special Mission':18,'Trainer & Light Attack':17,'Upgrade & Life Extension':17};

  const BASE={
    dr_sustain:89,dr_offset:81,dr_capability:74,dr_price:63,dr_trust:85,dr_schedule:71,
    st_capability:92,st_compliance:87,st_price:83,st_delivery:79,st_offset:66,st_sustain:58,
    pa_index:86,
    of_capTransfer:90,of_mro:85,of_training:76,of_ip:71,of_volume:52,
    cap_shortlist:88,cap_differentiator:47,pr_influence:58,rel_stock:83,
    bar_track:88,bar_localcontent:74,bar_cert:79,bar_finance:70,bar_partner:66,
    ref_lift:84,ne_index:69,
    ds_technical:56,ds_political:27,ds_financial:17,
    sov_then:44,sov_now:87,doc_then:52,doc_now:81,sust_then:61,sust_now:89,
    ofcap_then:48,ofcap_now:84,ofvol_then:73,ofvol_now:41,split_then:36,split_now:74,
    hd_sovereignty:88,hd_sustainment:85,hd_split:76,hd_offset:79,hd_docs:73,
    hd_reported:74,
    ol_budget:82,ol_integrated:79,ol_sovereignty:88,ol_upgrade:84,ol_localisation:80,
    ol_open_now:64,ol_open_3yr:81,ol_perc_then:48,ol_perc_now:67,ol_perc_3yr:79,
    ws_trainer:83,ws_rotary:86,ws_upgrade:89,ws_uav:72,ws_sim:64,
    bm_resp:87,bm_obs:83,bm_partner:76,bm_subtier:85,bm_fin:70,bm_ip:66,
    sv_scored:44,sv_precondition:33,sv_informal:23,
    sc_fastjet:63,sc_rotary:81,sc_transport:69,sc_trainer:84,sc_upgrade:88,
    ac_reference:89,ac_localMRO:84,ac_spares:86,ac_financing:75,ac_gtg:71,
    ef_reference:71,ef_localMRO:54,ef_spares:63,ef_financing:78,ef_gtg:44,
    cm_capexShare:29,cm_aeroShare:34,cm_orderBandLo:22,cm_orderBandHi:58,cm_shareLeader:47,
    cm_gapHead:33,cm_gapLife:14,cm_supportPkg:26,cm_cfhSpread:19,
    cm_locPremium:22,cm_discount:28,cm_keepflying:57,cm_cycle:38,
    cm_engage_then:11,cm_engage_now:21
  };
  const MKT={
    'India':{dr_offset:9,ds_technical:11,ds_political:-6,cap_shortlist:5,bar_cert:-8,bar_finance:-9,
             ol_localisation:9,cm_capexShare:4,cm_orderBandHi:16,cm_orderBandLo:9,ne_index:-4,sov_now:4,
             sust_then:7,sust_now:3,split_then:6,split_now:9,ofcap_now:5},
    'Greece':{ds_political:14,ds_technical:-7,bar_cert:12,dr_offset:-4,ol_budget:9,cm_capexShare:16,
              cm_orderBandHi:-8,cm_orderBandLo:-4,ne_index:-9,ol_perc_now:-8,ol_open_now:-9,rel_stock:5,
              sust_then:-9,sust_now:-2,split_then:-8,split_now:-11,ofcap_now:-4},
    'Peru':{ds_financial:16,ds_technical:-9,bar_finance:14,dr_price:8,ol_open_now:11,ol_perc_now:7,
            cm_capexShare:-11,cm_orderBandHi:-22,cm_orderBandLo:-13,ne_index:9,ws_rotary:6,bar_track:-5,
            sust_then:-14,sust_now:-6,split_then:-13,split_now:-4,ofcap_now:-7}
  };
  const DG={
    'Designation A':{dr_sustain:4,ol_budget:5,rel_stock:5},
    'Designation B':{dr_price:6,pr_influence:7,bar_finance:5},
    'Designation C':{dr_capability:9,cap_shortlist:6,dr_price:-7,pr_influence:-9},
    'Designation D':{dr_sustain:7,ws_rotary:8,bm_obs:7,ws_upgrade:6,pr_influence:-6},
    'Designation E':{dr_price:9,cm_capexShare:5,bar_finance:9,dr_sustain:-6,pr_influence:11},
    'Designation F':{dr_offset:11,of_capTransfer:6,ol_localisation:8},
    'Designation G':{dr_sustain:6,bm_resp:8,ws_rotary:5,pr_influence:-4},
    'Designation H':{bm_partner:9,rel_stock:7,ac_localMRO:6,pr_influence:5}
  };
  const SUP={
    'Client OEM':{cost:91,neutrality:90,capability:83,sustain:79,schedule:70,docs:68,offset:87},
    'Western Prime A':{cost:61,neutrality:56,capability:78,sustain:74,schedule:66,docs:64,offset:69},
    'Western Prime B':{cost:64,neutrality:53,capability:75,sustain:71,schedule:64,docs:62,offset:66},
    'Regional Challenger':{cost:74,neutrality:66,capability:68,sustain:63,schedule:60,docs:57,offset:61},
    'Legacy Supplier':{cost:70,neutrality:41,capability:62,sustain:48,schedule:46,docs:44,offset:49}
  };

  const rows=[];let id=1;
  for(const m in MARKETS){
    for(let i=0;i<MARKETS[m];i++){
      const d=DESIGS[Math.floor(rnd()*DESIGS.length)];
      const r={id:id++,market:m,desig:d,org:pickW(ORGS),seg:pickW(SEGS)};
      for(const k in BASE) r[k]=jit(BASE[k]+((MKT[m]||{})[k]||0)+((DG[d]||{})[k]||0),6);
      if(r.cm_orderBandHi<=r.cm_orderBandLo+6) r.cm_orderBandHi=r.cm_orderBandLo+6;
      const t=r.ds_technical+r.ds_political+r.ds_financial;
      r.ds_technical=Math.round(r.ds_technical/t*100);
      r.ds_political=Math.round(r.ds_political/t*100);
      r.ds_financial=100-r.ds_technical-r.ds_political;
      const t2=r.sv_scored+r.sv_precondition+r.sv_informal;
      r.sv_scored=Math.round(r.sv_scored/t2*100);
      r.sv_precondition=Math.round(r.sv_precondition/t2*100);
      r.sv_informal=100-r.sv_scored-r.sv_precondition;
      r.bh_split=r.split_now>=68?1:0;
      r.bh_cfh=r.dr_sustain>=84?1:0;
      r.bh_subtier=r.sov_now>=80?1:0;
      r.bh_embargo=r.pa_index>=82?1:0;
      r.pa_mode=r.pa_index>=88?'Never in writing':(r.pa_index>=76?'Raised informally':'Formally scored');
      r.eng_bucket=r.cap_shortlist>=90?'More than 18 months':(r.cap_shortlist>=82?'12 to 18 months':(r.cap_shortlist>=72?'6 to 12 months':'Only after RFP'));
      r.ol_cycle=r.ol_budget>=80?'Lengthen':(r.ol_budget>=68?'Unchanged':'Shorten');
      r.sup={};
      for(const sn in SUP){r.sup[sn]={};let sum=0,n=0;
        for(const a in SUP[sn]){const v=jit(SUP[sn][a],5);r.sup[sn][a]=v;sum+=v;n++}
        r.sup[sn].overall=Math.round(sum/n)}
      rows.push(r);
    }
  }
  return rows;
})();

/* ==========================================================================
   2. PALETTE + HELPERS  (restrained: mono purple ramp, one accent)
   ========================================================================== */
const P={d:'#3b2769',x:'#4a327f',m:'#5b3ea0',b:'#6f4bc4',l:'#8a63de',
         p3:'#b79ef0',p2:'#d8c9f7',p1:'#ece4fb',accent:'#1f9e8f',
         past:'#cdbdef',grid:'#f2eef9',axis:'#a49cba'};
const RAMP=['#3b2769','#4a327f','#5b3ea0','#6f4bc4','#8a63de','#a684e8','#c2aaf0','#dccdf9'];
const ramp=n=>n<=1?[P.b]:Array.from({length:n},(_,i)=>RAMP[Math.round(i*(RAMP.length-1)/(n-1))]);
const STACK3=['#3b2769','#7a58c9','#d3c3f5'];

const avg=(r,f)=>r.length?Math.round(r.reduce((a,x)=>a+x[f],0)/r.length):0;
const many=(r,fs)=>fs.map(f=>avg(r,f));
const groupAvg=(r,g,f,o)=>o.map(k=>avg(r.filter(x=>x[g]===k),f));
const countBy=(r,g,o)=>o.map(k=>r.filter(x=>x[g]===k).length);
const pctBy=(r,g,o)=>{const n=r.length||1;return o.map(k=>Math.round(r.filter(x=>x[g]===k).length/n*100))};
const pctFlag=(r,f)=>r.length?Math.round(r.filter(x=>x[f]===1).length/r.length*100):0;
const pctAbove=(r,f,t)=>r.length?Math.round(r.filter(x=>x[f]>=t).length/r.length*100):0;
const supAvg=(r,sp,a)=>r.length?Math.round(r.reduce((x,y)=>x+y.sup[sp][a],0)/r.length):0;
const zip=(a,b)=>a.map((v,i)=>[v,b[i]]);

const SUPS=['Client OEM','Western Prime A','Western Prime B','Regional Challenger','Legacy Supplier'];
const MKTS=['India','Greece','Peru'];
const DESIGS=['Designation A','Designation B','Designation C','Designation D','Designation E','Designation F','Designation G','Designation H'];
const DSHORT=DESIGS.map(d=>'Desig. '+d.slice(-1));

/* -- plugin: dots at bar tips (lollipop) and both ends (dumbbell/range) -- */
const tipDots={id:'tipDots',afterDatasetsDraw(ch,a,o){
  if(!o||!o.on)return;const R=o.r===undefined?5:o.r;if(R<=0)return;const ctx=ch.ctx;
  ch.data.datasets.forEach((ds,di)=>{
    const meta=ch.getDatasetMeta(di);if(meta.hidden)return;
    meta.data.forEach((el,i)=>{
      const cols=Array.isArray(ds.backgroundColor)?ds.backgroundColor[i]:ds.backgroundColor;
      const pts=o.both?[[el.base,o.startColor||P.p2],[el.x,o.endColor||P.d]]:[[el.x,cols]];
      pts.forEach(([x,c])=>{
        ctx.save();ctx.beginPath();ctx.arc(x,el.y,R,0,Math.PI*2);
        ctx.fillStyle=c;ctx.fill();
        ctx.lineWidth=1.6;ctx.strokeStyle='#fff';ctx.stroke();ctx.restore();
      });
    });
  });
}};
/* -- plugin: centre readout for doughnut / gauge -- */
const centreText={id:'centreText',afterDraw(ch,a,o){
  if(!o||!o.text)return;const {ctx,chartArea}=ch;if(!chartArea)return;
  const x=(chartArea.left+chartArea.right)/2;
  const y=(chartArea.top+chartArea.bottom)/2+(o.dy||0);
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  if(o.lock){
    ctx.strokeStyle=P.axis;ctx.lineWidth=1.5;
    ctx.strokeRect(x-8,y-4,16,11);
    ctx.beginPath();ctx.arc(x,y-4,4.6,Math.PI,0);ctx.stroke();
  }else{
    ctx.font="700 25px 'Inter'";ctx.fillStyle=o.color||P.x;
    ctx.fillText(o.text,x,y-5);
  }
  if(o.sub){ctx.font="600 9px 'Inter'";ctx.fillStyle=P.axis;
    ctx.letterSpacing='0.09em';ctx.fillText(o.sub,x,y+(o.lock?20:15))}
  ctx.restore();
}};
/* -- plugin: point labels for scatter / bubble -- */
const ptLabels={id:'ptLabels',afterDatasetsDraw(ch,a,o){
  if(!o||!o.on)return;const ctx=ch.ctx;
  ch.data.datasets.forEach((ds,di)=>{
    const meta=ch.getDatasetMeta(di);
    meta.data.forEach((el,i)=>{
      const t=ds.data[i]&&ds.data[i].t;if(!t)return;
      ctx.save();ctx.font="600 9.5px 'Inter'";ctx.fillStyle=P.axis;
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(t,el.x,el.y-(el.options&&el.options.radius?el.options.radius:5)-4);
      ctx.restore();
    });
  });
}};
Chart.register(tipDots,centreText,ptLabels);

const AX={grid:{display:false},border:{color:'#e6dff2'},ticks:{font:{size:10},padding:5}};

    font:{size:10.5,weight:'500'},color:P.axis}});

function makeConfig(e,rows){
  const d=e.compute(rows);
  const masked=e.mask==='values'||e.mask==='full';
  const cb=masked?(()=>'\u2007\u2007'):undefined;

  if(e.type==='gauge'){
    const v=d.value;
    return{type:'doughnut',data:{labels:['',''],datasets:[{data:[v,100-v],
      backgroundColor:[P.m,'#efe9f8'],borderWidth:0}]},
      options:{rotation:-90,circumference:180,cutout:'76%',
        plugins:{legend:{display:false},tooltip:TT(!masked),
          centreText:masked?{lock:true,sub:'WITHHELD',dy:20}:{text:v+(e.pct===false?'':''),sub:d.label,dy:22}}}};
  }
  if(e.type==='doughnut'){
    const cols=ramp(d.labels.length);
    let c=null;
    if(e.center==='n')c={text:String(rows.length),sub:'RESPONDENTS'};
    if(e.center==='pct')c={text:d.series[0].data[0]+'%',sub:String(d.labels[0]).toUpperCase()};
    if(masked)c={lock:true,sub:'WITHHELD'};
    return{type:'doughnut',data:{labels:d.labels,datasets:[{data:d.series[0].data,
      backgroundColor:cols,borderColor:'#fff',borderWidth:1.5}]},
      options:{cutout:'68%',plugins:{legend:{...LEG(true),position:'right',align:'center',
        labels:{boxWidth:8,boxHeight:8,usePointStyle:true,pointStyle:'rect',padding:8,
          font:{size:10},color:P.axis}},tooltip:TT(!masked),centreText:c}}};
  }
  if(e.type==='radar'){
    return{type:'radar',data:{labels:d.labels,datasets:d.series.map((s,i)=>({label:s.label,data:s.data,
      borderColor:s.color||P.b,backgroundColor:(s.color||P.b)+'22',borderWidth:1.8,
      pointBackgroundColor:s.color||P.b,pointRadius:2.6,pointHoverRadius:4}))},
      options:{plugins:{legend:LEG(true),tooltip:TT(!masked)},
        scales:{r:{beginAtZero:true,suggestedMax:100,grid:{color:P.grid},angleLines:{color:P.grid},
          pointLabels:{font:{size:10,weight:'500'},color:P.axis},ticks:{display:false}}}}};
  }
  if(e.type==='area'||e.type==='line'){
    return{type:'line',data:{labels:d.labels,datasets:d.series.map((s,i)=>({label:s.label,data:s.data,
      borderColor:s.color||ramp(d.series.length)[i],
      backgroundColor:(s.color||ramp(d.series.length)[i])+(e.type==='area'?'1f':'00'),
      borderWidth:1.9,tension:0,fill:e.type==='area',
      pointRadius:2.8,pointBackgroundColor:'#fff',pointBorderColor:s.color||ramp(d.series.length)[i],pointBorderWidth:1.8}))},
      options:{plugins:{legend:LEG(d.series.length>1),tooltip:TT(!masked)},
        scales:{x:AX,y:AY(cb)}}};
  }
  if(e.type==='scatter'||e.type==='bubble'){
    return{type:e.type,data:{datasets:d.series.map(s=>({label:s.label,data:s.data,
      backgroundColor:P.b+'d9',borderColor:'#fff',borderWidth:1.4,
      pointRadius:e.type==='scatter'?6:undefined,hoverRadius:e.type==='scatter'?8:undefined}))},
      options:{plugins:{legend:{display:false},ptLabels:{on:!masked},
        tooltip:{...TT(!masked),callbacks:{label:c=>c.raw.t+'  ·  '+Math.round(c.raw.x)+' / '+Math.round(c.raw.y)}}},
        layout:{padding:{top:14,right:12}},
        scales:{x:{...AX,grid:{color:P.grid,drawTicks:false},border:{display:false},
            title:{display:!!e.xLabel,text:e.xLabel||'',font:{size:9.5,weight:'600'},color:P.axis},ticks:{font:{size:10},callback:cb}},
          y:{...AY(cb),title:{display:!!e.yLabel,text:e.yLabel||'',font:{size:9.5,weight:'600'},color:P.axis}}}}};
  }
  if(e.type==='polar'||e.type==='pie'){
    const cols=ramp(d.labels.length),isPie=e.type==='pie';
    let c=null;
    if(isPie&&e.center==='pct')c=null;
    return{type:isPie?'pie':'polarArea',data:{labels:d.labels,datasets:[{data:d.series[0].data,
      backgroundColor:isPie?cols:cols.map(x=>x+'cc'),borderColor:'#fff',borderWidth:1.5}]},
      options:{plugins:{legend:{...LEG(true),position:'right',align:'center',
        labels:{boxWidth:8,boxHeight:8,usePointStyle:true,pointStyle:'rect',padding:8,
          font:{size:10},color:P.axis}},tooltip:TT(!masked),centreText:masked?null:c},
        scales:isPie?{}:{r:{beginAtZero:true,grid:{color:P.grid},angleLines:{color:P.grid},
          ticks:{display:false},border:{display:false}}}}};
  }
  if(e.type==='hbar'){
    const s=d.series[0],mx=Math.max(...s.data);
    const cols=d.highlight?s.data.map(v=>v===mx?P.d:P.p3):s.data.map(()=>P.b);
    return{type:'bar',data:{labels:d.labels,datasets:[{data:s.data,backgroundColor:cols,
      borderWidth:0,barPercentage:.66,categoryPercentage:.84}]},
      options:{indexAxis:'y',plugins:{legend:{display:false},
        tooltip:{...TT(!masked),callbacks:{label:c=>' '+c.raw}}},
        scales:{x:{...AY(cb),grid:{color:P.grid,drawTicks:false}},
          y:{grid:{display:false},border:{color:'#e6dff2'},
            ticks:{font:{size:10.5,weight:'500'},color:P.ink,autoSkip:false}}}}};
  }
  if(e.type==='vstack'){
    return{type:'bar',data:{labels:d.labels,datasets:d.series.map((s,i)=>({label:s.label,data:s.data,
      backgroundColor:s.color||ramp(d.series.length)[i],borderWidth:0,
      barPercentage:.5,categoryPercentage:.85}))},
      options:{plugins:{legend:LEG(true),tooltip:TT(!masked)},
        scales:{x:{...AX,stacked:true},y:{...AY(cb),stacked:true,max:100}}}};
  }
  if(e.type==='slope'){
    const pairs=d.series[0].data,cols=ramp(pairs.length);
    return{type:'line',data:{labels:[e.startLabel||'Then',e.endLabel||'Now'],
      datasets:pairs.map((pr,i)=>({label:d.labels[i],data:[pr[0],pr[1]],
        borderColor:cols[i],backgroundColor:cols[i],borderWidth:2,tension:0,
        pointRadius:4.6,pointHoverRadius:6.4,pointBackgroundColor:'#fff',
        pointBorderColor:cols[i],pointBorderWidth:2}))},
      options:{layout:{padding:{left:8,right:12,top:6}},
        plugins:{legend:LEG(true),tooltip:TT(!masked)},
        scales:{x:{...AX,offset:true,grid:{color:P.grid,drawTicks:false}},y:AY(cb)}}};
  }
  if(e.type==='gbar'){
    let ds;
    if(d.series.length>1){
      const cols=d.series.length===2?[P.p3,P.d]:ramp(d.series.length);
      ds=d.series.map((s,i)=>({label:s.label,data:s.data,backgroundColor:s.color||cols[i]}));
    }else{
      const pairs=d.series[0].data;
      ds=[{label:e.startLabel||'Then',data:pairs.map(pr=>pr[0]),backgroundColor:P.p3},
          {label:e.endLabel||'Now', data:pairs.map(pr=>pr[1]),backgroundColor:P.d}];
    }
    return{type:'bar',data:{labels:d.labels,datasets:ds.map(x=>({...x,borderWidth:0,
      barPercentage:.8,categoryPercentage:.6}))},
      options:{plugins:{legend:LEG(true),tooltip:TT(!masked)},scales:{x:AX,y:AY(cb)}}};
  }
  if(e.type==='hstack'){
    return{type:'bar',data:{labels:d.labels,datasets:d.series.map((s,i)=>({label:s.label,data:s.data,
      backgroundColor:s.color||ramp(d.series.length)[i],borderWidth:0,barPercentage:.52,categoryPercentage:.9}))},
      options:{indexAxis:'y',plugins:{legend:LEG(true),tooltip:TT(!masked)},
        scales:{x:{stacked:true,max:100,grid:{color:P.grid,drawTicks:false},border:{display:false},
            ticks:{font:{size:10},callback:cb}},
          y:{stacked:true,grid:{display:false},border:{color:'#e6dff2'},ticks:{font:{size:10.5,weight:'500'},color:P.ink}}}}};
  }
  if(e.type==='dumbbell'||e.type==='range'){
    const isRange=e.type==='range';
    return{type:'bar',data:{labels:d.labels,datasets:[{label:'',data:d.series[0].data,
      backgroundColor:isRange?P.p2:'#ded1f5',borderWidth:0,
      barThickness:isRange?11:3,borderSkipped:false}]},
      options:{indexAxis:'y',
        plugins:{legend:{display:false},
          tipDots:{on:true,both:true,r:isRange?0:5.2,startColor:P.p3,endColor:P.d},
          tooltip:{...TT(!masked),callbacks:{label:c=>{
            const v=c.raw;return (e.startLabel||'Low')+' '+v[0]+'   →   '+(e.endLabel||'High')+' '+v[1]}}}},
        scales:{x:{...AY(cb),grid:{color:P.grid,drawTicks:false}},
          y:{grid:{display:false},border:{color:'#e6dff2'},
            ticks:{font:{size:10.5,weight:'500'},color:P.ink,autoSkip:false}}}}};
  }
  if(e.type==='lollipop'){
    const s=d.series[0],mx=Math.max(...s.data);
    const cols=d.highlight?s.data.map(v=>v===mx?P.d:P.p3):s.data.map(()=>P.b);
    return{type:'bar',data:{labels:d.labels,datasets:[{data:s.data,backgroundColor:cols,
      barThickness:2,borderWidth:0}]},
      options:{indexAxis:'y',plugins:{legend:{display:false},tipDots:{on:true,r:5},
        tooltip:{...TT(!masked),callbacks:{label:c=>' '+c.raw}}},
        layout:{padding:{right:10}},
        scales:{x:{...AY(cb),grid:{color:P.grid,drawTicks:false}},
          y:{grid:{display:false},border:{color:'#e6dff2'},
            ticks:{font:{size:10.5,weight:'500'},color:P.ink,autoSkip:false}}}}};
  }
  if(e.type==='mixed'){
    return{type:'bar',data:{labels:d.labels,datasets:d.series.map((s,i)=>
      s.kind==='line'
        ?{type:'line',label:s.label,data:s.data,borderColor:P.accent,backgroundColor:P.accent,
          borderWidth:1.8,tension:0,pointRadius:3,pointBackgroundColor:'#fff',pointBorderColor:P.accent,pointBorderWidth:1.8,order:0}
        :{type:'bar',label:s.label,data:s.data,backgroundColor:P.p3,hoverBackgroundColor:P.b,
          borderWidth:0,barPercentage:.55,order:1})},
      options:{plugins:{legend:LEG(true),tooltip:TT(!masked)},scales:{x:AX,y:AY(cb)}}};

function buildPages(){
  document.getElementById('main').innerHTML=SECTIONS.map(s=>{
    const panels=REG.filter(e=>e.sec===s.id);
    const conf=(s.id==='cm'||s.id==='rc')?CONF_NOTE:'';
    const body=(s.id==='rc'?RECS:'')+`<div class="grid">${panels.map(panelHTML).join('')}</div>`;
    return `<section class="page ${s.id==='ov'?'on':''}" id="pg_${s.id}">
      <div class="eyebrow">${s.eyebrow}</div>
      <h1 class="sec-title">${s.title}</h1>
      <div class="sec-sub">${s.sub}</div>
      ${conf}
      <div class="kpis" id="kpi_${s.id}"></div>
      ${body}
      ${s.id==='rc'?'<div class="foot">Illustrative preview. Index values are directional and drawn from a 100-respondent buyer-side survey across India, Greece and Peru. Respondent identity, employer and designation, and all quantitative and commercial findings, are withheld in this sample.</div>':''}
    </section>`;
  }).join('');

  document.getElementById('nav').innerHTML=SECTIONS.map((s,i)=>
    `<div class="navitem ${s.id==='ov'?'on':''}" data-sec="${s.id}">
       <div class="navno">${String(i+1).padStart(2,'0')}</div>
       <div class="navtxt">${s.name}</div>
       <div class="badge">${REG.filter(e=>e.sec===s.id).length}</div></div>`).join('');

  document.querySelectorAll('.navitem').forEach(n=>n.onclick=()=>{
    document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('on'));

  const note=fnoteText();
  REG.filter(e=>e.sec===sec).forEach(e=>{
    const el=document.getElementById('cv_'+e.id);if(!el)return;
    if(charts[e.id]){charts[e.id].destroy();delete charts[e.id]}
    charts[e.id]=new Chart(el.getContext('2d'),makeConfig(e,VIEW));
    const fn=document.getElementById('fn_'+e.id);
    if(fn)fn.innerHTML=(e.mask&&VIEW.length?LOCKSM:'')+'<span>'+note+'</span>';
  });
}

function applyFilters(){
  const m=f_market.value,d=f_desig.value,o=f_org.value,g=f_seg.value;
  VIEW=DB.filter(r=>(m==='ALL'||r.market===m)&&(d==='ALL'||r.desig===d)&&(o==='ALL'||r.org===o)&&(g==='ALL'||r.seg===g));
  document.getElementById('npill').textContent='n = '+VIEW.length;
  document.getElementById('s1').textContent=VIEW.length;
  document.getElementById('b1').style.width=Math.round(VIEW.length/DB.length*100)+'%';
  const mk=new Set(VIEW.map(r=>r.market)).size;
  document.getElementById('s2').textContent=mk;
  document.getElementById('b2').style.width=Math.round(mk/3*100)+'%';
  const si=avg(VIEW,'dr_sustain');
  document.getElementById('s3').textContent=si;
  document.getElementById('b3').style.width=si+'%';
  renderSection(CUR);
}

(function init(){
  const fill=(id,arr)=>{const s=document.getElementById(id);
    arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)})};
  fill('f_market',MKTS);fill('f_desig',DESIGS);fill('f_org',ORGS);fill('f_seg',SEGS);
  ['f_market','f_desig','f_org','f_seg'].forEach(id=>document.getElementById(id).onchange=applyFilters);
  buildPages();applyFilters();
})();
</script>
</body>
