<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encube Ethicals | Employee Engagement Dashboard | Ken Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Hind:wght@400;500;600;700&family=Hind+Siliguri:wght@500;600&family=Noto+Sans+Oriya:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --k0:#1F1266;--k1:#2E1A87;--k2:#4A2FB3;--k3:#6D52D4;--k4:#9C86E6;--k5:#C9BEF2;--k6:#E6E0FA;
  --teal:#6D52D4;--teal2:#C9BEF2;--blue:#4A2FB3;--blue2:#C9BEF2;--rose:#7B2D8E;--rose2:#D9C8F0;--grey:#D9D4EC;
  --ink:#231A55;--ink2:#443C75;--muted:#7C7A9C;--faint:#A7A3C4;--line:#E9E5F6;
  --bg:#F3F1FA;--card:#FFFFFF;--soft:#F7F5FD;
  --shadow:0 1px 2px rgba(35,26,85,.04),0 8px 24px rgba(35,26,85,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Baloo 2','Plus Jakarta Sans',sans-serif;letter-spacing:-.01em}
button,select{font-family:inherit}

.topbar{position:sticky;top:0;z-index:60;background:linear-gradient(100deg,#1F1266 0%,#2E1A87 40%,#4A2FB3 75%,#6D52D4 100%);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 16px rgba(31,18,102,.3)}
.brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;letter-spacing:.06em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .mk{width:26px;height:26px;border-radius:7px;background:#fff;color:var(--k1);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;letter-spacing:0}
.brand span.sep{opacity:.5;font-weight:600}
.studyname{font-size:12.5px;opacity:.9;padding-left:14px;border-left:1px solid rgba(255,255,255,.28);line-height:1.3}
.studyname b{display:block;font-size:13px}
.dummy{background:#4A2FB3;color:#fff;font-size:11.5px;font-weight:700;border-radius:7px;padding:5px 10px;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.btn-reset{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.btn-reset:hover{background:rgba(255,255,255,.26)}
.chip-n{background:rgba(255,255,255,.95);color:var(--k1);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:800;white-space:nowrap}

.ms{position:relative}
.msb{appearance:none;background:rgba(255,255,255,.14) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 10px center;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px 28px 7px 12px;font-size:12px;font-weight:600;cursor:pointer;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.msb:hover{background-color:rgba(255,255,255,.24)}
.msb.act{background-color:rgba(255,255,255,.3);border-color:rgba(255,255,255,.75)}
.mspanel{display:none;position:absolute;top:calc(100% + 7px);right:0;z-index:90;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(35,26,85,.24);padding:7px;min-width:220px;max-height:340px;overflow-y:auto}
.mspanel.on{display:block}
.msopt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:12.5px;color:var(--ink2);font-weight:600;cursor:pointer;white-space:nowrap}
.msopt:hover{background:var(--soft)}
.msopt i{width:15px;height:15px;border-radius:4px;border:1.5px solid #D5D1EC;flex:0 0 15px;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#fff;font-style:normal}
.msopt.on{color:var(--k2)}
.msopt.on i{background:var(--k2);border-color:var(--k2)}
.msopt small{margin-left:auto;color:var(--faint);font-weight:700}
.msfoot{border-top:1px solid var(--line);margin-top:5px;padding-top:5px;text-align:right}
.msclr{background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:4px 7px}

.crossbar{position:sticky;top:60px;z-index:55;display:none;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:9px 18px;box-shadow:0 4px 12px rgba(35,26,85,.05)}
.crossbar.on{display:flex}
.cbl{font-size:11px;font-weight:800;color:var(--faint)}
.fchip{display:inline-flex;align-items:center;gap:7px;background:#EEEAFD;border:1px solid #DCD3FA;color:var(--k2);border-radius:999px;padding:5px 8px 5px 12px;font-size:12px;font-weight:700;cursor:pointer;margin:2px 0}
.fchip em{font-style:normal;color:var(--muted);font-weight:600}
.fchip:hover{background:#E3DCFC}
.fchip b{background:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--k2)}
.cbclear{background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}
.cbnote{margin-left:auto;font-size:11px;color:var(--faint);font-style:italic}

.shell{display:flex;align-items:flex-start}
.side{width:256px;flex:0 0 256px;position:sticky;top:100px;height:calc(100vh - 100px);overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:18px 14px 40px}
.eyebrow{font-size:11px;font-weight:800;color:var(--faint);margin:0 0 10px 8px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:11px;padding:9px 11px;margin-bottom:2px;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.navitem:hover{background:var(--soft);color:var(--k2)}
.navitem.on{background:linear-gradient(95deg,var(--k1),var(--k3));color:#fff;box-shadow:0 6px 16px rgba(46,26,135,.3)}
.navitem svg{width:17px;height:17px;flex:0 0 17px}
.navitem .cnt{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--soft);color:var(--muted);border-radius:6px;padding:1px 7px}
.navitem.on .cnt{background:rgba(255,255,255,.2);color:#fff}
.navitem .must{width:6px;height:6px;border-radius:50%;background:#8E76E0;flex:0 0 6px}
.snap{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.snapcard{background:var(--soft);border-radius:12px;padding:10px 13px;margin-bottom:8px}
.snapcard .big{font-family:'Baloo 2',sans-serif;font-size:23px;font-weight:800;color:var(--k2);line-height:1.15}
.snapcard .lbl{font-size:11px;color:var(--muted);font-weight:600}
.snapcard .sb{height:4px;border-radius:4px;background:#E7E3F6;margin-top:6px;overflow:hidden}
.snapcard .sb i{display:block;height:100%;background:linear-gradient(90deg,var(--k1),var(--k4));border-radius:4px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.snapnote{font-size:10.5px;color:var(--faint);line-height:1.4;margin:10px 4px 0}

.main{flex:1;min-width:0;padding:22px 26px 70px}
.page{display:none}
.page.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.phead .pn{flex:0 0 auto;background:var(--k1);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;border-radius:8px;min-width:36px;height:32px;display:flex;align-items:center;justify-content:center;padding:0 10px}
.ptitle{font-size:19px;font-weight:800;margin:0;color:var(--k1);line-height:1.15}
.psub{color:var(--muted);font-size:12px;margin:4px 0 0;max-width:900px}

.keybar{display:grid;grid-template-columns:92px 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.keybar .kic{background:var(--k1);display:flex;align-items:center;justify-content:center}
.keybar .kic svg{width:38px;height:38px;stroke:#fff}
.keybar .kbody{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 18px}
.keybar .ktxt{flex:1 1 380px;font-size:13px;color:var(--ink2);line-height:1.55}
.keybar .ktxt b{color:var(--k1)}
.keybar .kpts{display:flex;gap:0;flex-wrap:wrap}
.keybar .kpt{display:flex;align-items:center;gap:8px;padding:4px 14px;border-left:1px dashed #D6D0EE;font-size:11.5px;font-weight:700;color:var(--k2);max-width:175px;line-height:1.3}
.keybar .kpt svg{width:24px;height:24px;flex:0 0 24px;stroke:var(--k2)}

.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.span2{grid-column:span 2}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 19px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.ctitle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--k1);margin:0 0 7px;font-family:'Baloo 2',sans-serif;line-height:1.2}
.ctitle .tag{flex:0 0 auto;font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;font-weight:800;color:#fff;background:var(--k1);border-radius:6px;padding:2px 7px}
.ctitle .tag.req{background:#EDE8FB;color:#2E1A87}
.kpi.req{border-top:3px solid #8E76E0}
.nb{margin-left:auto;flex:0 0 auto;font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;font-weight:800;color:#6B6890;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:3px 9px;white-space:nowrap}
.qline{font-size:12px;color:var(--ink2);background:#FAF9FF;border-left:3px solid var(--k5);padding:6px 11px;border-radius:0 8px 8px 0;margin:0 0 10px;line-height:1.45}
.qline b{color:var(--k2);font-weight:800;font-size:10.5px;margin-right:6px}
.chartbox{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center}
.chartbox>svg{max-width:560px;margin-left:auto;margin-right:auto}
.brow.w{grid-template-columns:minmax(110px,1.25fr) minmax(70px,1fr) 92px}
.sublbl{font-size:12px;font-weight:800;color:var(--k1);margin:8px 0 6px}
.insight{margin:13px 0 0;background:var(--soft);border-radius:11px;padding:10px 13px;font-size:12.3px;color:var(--ink2);line-height:1.55}
.insight b{color:var(--k1);font-weight:800}
.ilbl{display:inline-block;font-size:10px;font-weight:800;color:var(--k2);background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 7px;margin-right:7px;vertical-align:1px}
.cnote{font-size:11px;color:#9B98B8;margin-top:8px;font-style:italic;line-height:1.45}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:default}
.kpi .v{font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:800;color:var(--k1);line-height:1.1}
.kpi .v small{font-size:15px;color:var(--k3)}
.kpi .k{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:3px;line-height:1.3}
.kpi .d{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
.kpi .bar{position:absolute;left:17px;right:17px;bottom:9px;height:4px;border-radius:4px;background:#EEEBF9;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--k1),var(--k4));transition:width .6s cubic-bezier(.3,1,.4,1)}
.kpi.req{border-top:3px solid #8E76E0}

.blist{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(110px,1.25fr) minmax(70px,1fr) 58px;align-items:center;gap:11px;border-radius:7px;transition:opacity .2s}
.brow.clk{cursor:pointer}
.brow.clk:hover .bt{background:#E4DFF7}
.brow.dim{opacity:.32}
.brow.sel .bl{color:var(--k2)}
.brow .bl{font-size:12.3px;color:var(--ink2);font-weight:600;line-height:1.25}
.brow .bt{height:12px;background:#F0EDFA;border-radius:6px;overflow:hidden;transition:background .2s}
.brow .bf{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.brow .bv{font-size:12.5px;font-weight:800;color:var(--ink);text-align:right;line-height:1.1}
.brow .bv small{font-weight:600;color:var(--muted);font-size:10.5px;display:block}

.legend{display:flex;flex-direction:column;gap:6px;justify-content:center}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:600;border-radius:6px;padding:2px 4px;line-height:1.25}
.legend div.clk{cursor:pointer}
.legend div.clk:hover{background:var(--soft)}
.legend div.dim{opacity:.35}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.legend b{margin-left:auto;color:var(--ink);font-weight:800;padding-left:10px;white-space:nowrap}
.chartrow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px;align-items:center}
svg{display:block;width:100%;height:auto;overflow:visible}
.clk{cursor:pointer}
svg .clk:hover{filter:brightness(1.08)}
.dimmed{opacity:.25}

#tip{position:fixed;z-index:200;pointer-events:none;display:none;max-width:290px;background:#231A55;color:#fff;border-radius:10px;padding:9px 12px;font-size:12px;line-height:1.45;box-shadow:0 10px 30px rgba(35,26,85,.3)}
#tip .tt{font-weight:800;font-size:12.5px;display:block;margin-bottom:3px}
#tip .tv{color:#D9D2F5;display:block}
#tip .tc{display:block;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.18);font-size:10.5px;color:#B9AFEA;font-weight:700}

table.ht{width:100%;border-collapse:separate;border-spacing:4px;font-size:12px}
table.ht th{font-size:11px;color:var(--muted);font-weight:800;padding:4px 6px;text-align:center;line-height:1.25;vertical-align:bottom}
table.ht th.rl{text-align:left}
table.ht td{text-align:center;border-radius:8px;padding:9px 6px;font-weight:800;color:var(--ink);line-height:1.2}
table.ht td.rl{text-align:left;background:none;font-weight:700;color:var(--ink2);padding-left:2px}
table.ht td small{display:block;font-weight:600;font-size:10px;opacity:.75}
table.ht td.clk:hover{outline:2px solid var(--k3)}
table.ht td.dim{opacity:.3}

.pillars{display:flex;flex-direction:column;gap:10px}
.pillar{display:grid;grid-template-columns:1fr 64px 120px 64px 1fr;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px}
.pillar .side-l{text-align:right;font-size:12px;font-weight:700;color:var(--rose)}
.pillar .side-r{font-size:12px;font-weight:700;color:var(--teal)}
.pillar .pct{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:800;text-align:center;line-height:1}
.pillar .pct small{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:9.5px;color:var(--muted);font-weight:700}
.pillar .mid{text-align:center;font-size:11px;font-weight:800;color:#fff;background:var(--k1);border-radius:8px;padding:6px 6px;line-height:1.25}

.pos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.poscard{border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:#fff;border-top:4px solid var(--k2);cursor:pointer}
.poscard.dimmed{opacity:.35}
.poscard h4{margin:0 0 2px;font-size:16px;color:var(--k1)}
.poscard .sz{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:9px}
.poscard .ln{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:12px;padding:5px 0;border-top:1px dashed #ECE8F8;line-height:1.35}
.poscard .ln span:first-child{color:var(--muted);font-weight:700}
.poscard .ln span:last-child{color:var(--ink2);font-weight:700}
.poscard .stmt{margin-top:9px;background:var(--soft);border-radius:10px;padding:9px 11px;font-size:12.3px;color:var(--ink);line-height:1.5}

.vwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.vq{background:var(--soft);border-left:3px solid var(--k3);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.vq b{display:block;font-size:10.5px;font-weight:800;color:var(--k2);margin-bottom:5px}
.vq em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:600}
.vq.live{border-left-color:#8E76E0}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tabbtn{background:var(--soft);border:1px solid var(--line);color:var(--ink2);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.tabbtn:hover{background:#EEEAFD}
.tabbtn.on{background:var(--k1);border-color:var(--k1);color:#fff}

.finding{display:flex;gap:13px;align-items:flex-start;padding:11px 4px}
.finding+.finding{border-top:1px solid #F1EEFA}
.fnum{flex:0 0 28px;height:28px;border-radius:50%;background:linear-gradient(140deg,var(--k1),var(--k3));color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.finding p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.55}
.finding p b{color:var(--k1)}
.rec{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px 19px;box-shadow:var(--shadow);border-top:4px solid var(--k2)}
.rec .rt{font-size:11px;font-weight:800;color:var(--k3);margin-bottom:5px}
.rec h4{margin:0 0 7px;font-size:16px;font-weight:800;color:var(--k1);line-height:1.3}
.rec p{margin:0 0 8px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.rec ul{margin:0;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.6}
.rec ul b{color:var(--ink)}

.mapnote{display:flex;gap:12px;align-items:flex-start;background:#F5F2FD;border:1px solid #DDD5F7;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#443C75;line-height:1.55}
.mapnote svg{width:22px;height:22px;flex:0 0 22px;stroke:#6D52D4}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.covitem{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.covitem:hover{background:#EEEAFD}
.covitem .dot{width:26px;height:26px;border-radius:8px;background:var(--k1);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.covitem .dot svg{width:15px;height:15px;stroke:#fff}
.covitem b{display:block;font-size:12.5px;color:var(--k1)}
.covitem span{font-size:11.5px;color:var(--muted);line-height:1.35;display:block}
.hero{background:linear-gradient(115deg,#1F1266 0%,#2E1A87 45%,#4A2FB3 100%);border-radius:18px;padding:22px 26px;color:#fff;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;margin-bottom:16px;box-shadow:0 12px 30px rgba(31,18,102,.25)}
.hero h2{font-size:28px;line-height:1.15;margin:0 0 8px;font-weight:800}
.hero p{margin:0;font-size:13.5px;opacity:.9;line-height:1.6;max-width:640px}
.hero .hstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hero .hs{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 13px}

 q9:['How effectively does your manager provide constructive feedback and recognise your contributions?','आपके मैनेजर कितने प्रभावी ढंग से रचनात्मक फीडबैक देते हैं और आपके योगदान की सराहना करते हैं?','तुमचे व्यवस्थापक किती प्रभावीपणे रचनात्मक अभिप्राय देतात आणि तुमच्या योगदानाची दखल घेतात?','तुमचो व्यवस्थापक कितल्या प्रभावीपणान रचनात्मक अभिप्राय दिता आनी तुमच्या योगदानाची दखल घेता?'],
 q10:['How often does unnecessary managerial intervention restrict your ability to complete work independently?','अनावश्यक मैनेजर हस्तक्षेप कितनी बार आपके स्वतंत्र रूप से काम पूरा करने में बाधा डालता है?','अनावश्यक व्यवस्थापकीय हस्तक्षेपामुळे तुम्हाला स्वतंत्रपणे काम पूर्ण करण्यात किती वेळा अडथळा येतो?','अनावश्यक व्यवस्थापकीय हस्तक्षेपाक लागून तुमकां स्वतंत्रपणान काम पुराय करपाक कितली फावट आडमेळ येता?'],
 q11:['How fairly does your manager allocate work and evaluate team performance?','आपके मैनेजर काम का बँटवारा और टीम के प्रदर्शन का मूल्यांकन कितनी निष्पक्षता से करते हैं?','तुमचे व्यवस्थापक कामाचे वाटप आणि टीमच्या कामगिरीचे मूल्यांकन किती न्याय्यपणे करतात?','तुमचो व्यवस्थापक कामाचें वाटप आनी टीमच्या कामगिरेचें मुल्यांकन कितल्या न्याय्यपणान करता?'],
 q12:['How effectively does your manager address work-related challenges and remove obstacles?','आपके मैनेजर काम से जुड़ी चुनौतियों को कितने प्रभावी ढंग से संभालते हैं और रुकावटें दूर करते हैं?','तुमचे व्यवस्थापक कामाशी संबंधित आव्हाने किती प्रभावीपणे हाताळतात आणि अडथळे दूर करतात?','तुमचो व्यवस्थापक कामा संबंदीत आव्हानां कितल्या प्रभावीपणान हाताळटा आनी आडमेळीं पयस करता?'],
 q13:['How comfortable are you raising concerns or disagreeing with your immediate manager without fear of negative consequences?','नकारात्मक परिणाम के डर के बिना अपने तत्काल मैनेजर के सामने चिंता उठाने या असहमति जताने में आप कितना सहज हैं?','नकारात्मक परिणामांच्या भीतीशिवाय तुमच्या थेट व्यवस्थापकासमोर तक्रार मांडण्यात किंवा असहमती दर्शवण्यात तुम्ही किती सहज आहात?','नकारात्मक परिणामांची भिरांत नासतना तुमच्या थेट व्यवस्थापका मुखार काळजी मांडपाक वा असहमती दाखोवपाक तुमी कितले सोंपेपणान आसात?'],
 q14:['How manageable is your workload within your normal working hours or assigned shifts?','आपके सामान्य कार्य घंटों या निर्धारित शिफ्ट में आपका कार्यभार कितना संभालने योग्य है?','तुमच्या नेहमीच्या कामाच्या वेळेत किंवा नेमून दिलेल्या पाळीत तुमचा कामाचा ताण किती सांभाळण्याजोगा आहे?','तुमच्या सदांच्या कामाच्या वेळांत वा दिल्ल्या पाळयेंत तुमचो कामाचो भार कितलो सांबाळपाक जाता?'],
 q15:['How adequately are you equipped with the tools, materials, information and training required for your role?','आपकी भूमिका के लिए ज़रूरी उपकरण, सामग्री, जानकारी और प्रशिक्षण आपको कितनी पर्याप्त मात्रा में मिलते हैं?','तुमच्या भूमिकेसाठी आवश्यक साधने, साहित्य, माहिती आणि प्रशिक्षण तुम्हाला किती पुरेसे मिळते?','तुमच्या भुमिके खातीर गरजेचीं साधनां, सामान, म्हायती आनी प्रशिक्षण तुमकां कितलें पुरो मेळटा?'],
 q16:['How often do work demands interfere with your personal commitments or recovery time?','काम की माँगें कितनी बार आपकी निजी ज़िम्मेदारियों या आराम के समय में बाधा डालती हैं?','कामाच्या मागण्या किती वेळा तुमच्या वैयक्तिक जबाबदाऱ्या किंवा विश्रांतीच्या वेळेत अडथळा आणतात?','कामाच्यो मागण्यो कितली फावट तुमच्या खाजगी जापसालदारक्यांनी वा विसव्याच्या वेळांत आडमेळ हाडटात?'],
 q17:['How effectively do other teams coordinate with you to complete your work?','आपका काम पूरा करने के लिए दूसरी टीमें आपके साथ कितना प्रभावी तालमेल रखती हैं?','तुमचे काम पूर्ण करण्यासाठी इतर टीम तुमच्याशी किती प्रभावीपणे समन्वय साधतात?','तुमचें काम पुराय करपाक हेर टीम तुमचे कडेन कितलो प्रभावी समन्वय दवरतात?'],
 q18:['How comfortable are you reporting quality concerns, procedural deviations or unsafe working conditions?','गुणवत्ता से जुड़ी चिंताएँ, प्रक्रिया में विचलन या असुरक्षित कार्य स्थितियाँ रिपोर्ट करने में आप कितना सहज हैं?','गुणवत्तेच्या तक्रारी, प्रक्रियेतील विचलन किंवा असुरक्षित कामाची परिस्थिती कळवण्यात तुम्ही किती सहज आहात?','गुणवत्तेच्यो काळजी, प्रक्रियेंतलें विचलन वा असुरक्षीत कामाची परिस्थिती कळोवपाक तुमी कितले सोंपेपणान आसात?'],

 q20:['Overall, how engaged do you feel in your work?','कुल मिलाकर, आप अपने काम से कितना जुड़ाव महसूस करते हैं?','एकूणच, तुम्ही तुमच्या कामात किती गुंतलेले आहात असे वाटते?','एकंदरीत, तुमी तुमच्या कामांत कितले गुंतिल्ले आसात अशें दिसता?'],

function staticText(){const H=document.documentElement;H.lang=LANG;H.dir='ltr';document.title=L('Encube Ethicals | Employee Engagement Dashboard | Ken Research','एनक्यूब एथिकल्स | कर्मचारी जुड़ाव डैशबोर्ड | केन रिसर्च','एनक्यूब एथिकल्स | कर्मचारी सहभाग डॅशबोर्ड | केन रिसर्च','एनक्यूब एथिकल्स | कर्मचारी सहभाग डॅशबोर्ड | केन रिसर्च');
  const set=(id,k)=>{const e=document.getElementById(id);if(e)e.textContent=T(k);};
  document.getElementById('studyname').innerHTML=`<b>${T('study')}</b>${T('studysub')}`;
  set('illus','illus');set('reset','clear');set('cbl','filtered');set('cbclear','clearf');set('cbnote','cbnote');set('s1l','snap1');set('s2l','snap2');set('s3l','snap3');set('s4l','snap4');set('snapnote','snapnote');set('eyebrow','eyebrow');
  buildLang();setEmpty();}
function render(){const pg=PAGES.find(p=>p.id===CUR_PAGE);const el=document.getElementById('p-'+CUR_PAGE);
  try{el.innerHTML=pg.fn();}catch(e){el.innerHTML=`<div class="empty">${T('err')}</div>`;console.error(e);}
  buildSlicers();renderChips();snapshot();}
function go(id,anchor){CUR_PAGE=id;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));buildNav();render();
  if(anchor){const a=document.getElementById(anchor);if(a){const y=a.getBoundingClientRect().top+window.scrollY-110;window.scrollTo({top:y,behavior:'smooth'});a.classList.add('flash');setTimeout(()=>a.classList.remove('flash'),1600);return;}}
  window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('main').innerHTML=PAGES.map(p=>`<section class="page${p.id===CUR_PAGE?' on':''}" id="p-${p.id}"></section>`).join('');
  staticText();buildNav();render();
  const tip=document.getElementById('tip');
  document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tt]');if(!t||!t.dataset.tt){tip.style.display='none';return;}tip.innerHTML=t.dataset.tt;tip.style.display='block';});
  document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px';}});
  document.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tt]'))tip.style.display='none';});
  document.addEventListener('click',e=>{
    const rg=e.target.closest('[data-rg]');if(rg){const p=rg.nextElementSibling;const was=p.classList.contains('on');document.querySelectorAll('.mspanel,.rgpanel').forEach(x=>x.classList.remove('on'));if(!was)p.classList.add('on');return;}
    const lg=e.target.closest('[data-lang]');if(lg){LANG=lg.dataset.lang;document.querySelectorAll('.rgpanel').forEach(x=>x.classList.remove('on'));staticText();buildNav();render();return;}
    if(!e.target.closest('.rgw'))document.querySelectorAll('.rgpanel').forEach(x=>x.classList.remove('on'));
    const gq=e.target.closest('[data-goq]');if(gq){go('index','s-'+gq.dataset.goq);return;}
    const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return;}
    const cs=e.target.closest('[data-csite]');if(cs){CSITE=cs.dataset.csite;CMPM=LOC_L.filter(c=>CSITE==='All'||LOCS.find(l=>l[0]===c)[1]===CSITE);render();return;}
    const cm=e.target.closest('[data-cmpm]');if(cm){const v=cm.dataset.cmpm;if(v==='__all')CMPM=LOC_L.filter(c=>CSITE==='All'||LOCS.find(l=>l[0]===c)[1]===CSITE);else if(v==='__clear')CMPM=[];else CMPM=CMPM.includes(v)?CMPM.filter(x=>x!==v):[...CMPM,v];render();return;}
    const ms=e.target.closest('[data-ms]');if(ms&&CLOCK()&&ms.dataset.ms==='loc')return;if(ms){const p=ms.nextElementSibling,was=p.classList.contains('on');document.querySelectorAll('.mspanel,.rgpanel').forEach(x=>x.classList.remove('on'));if(!was)p.classList.add('on');return;}
    const mo=e.target.closest('[data-msk]');if(mo){toggleF(mo.dataset.msk,mo.dataset.msv);render();return;}
    const mc=e.target.closest('[data-msclr]');if(mc){delete CROSS[mc.dataset.msclr];render();return;}
    if(!e.target.closest('.ms'))document.querySelectorAll('.mspanel').forEach(x=>x.classList.remove('on'));
    const ch=e.target.closest('[data-ck]');if(ch){dropF(ch.dataset.ck,ch.dataset.cv);render();return;}
    const xm=e.target.closest('[data-xm]');if(xm){XM=xm.dataset.xm;render();return;}
    const xs=e.target.closest('[data-xswap]');if(xs){[XR,XC]=[XC,XR];render();return;}
    const k=e.target.closest('[data-k]');if(k&&CLOCK()&&(k.dataset.k==='loc'||k.dataset.k2==='loc'))return;if(k&&k.dataset.k){
      const k2=k.dataset.k2,v2=k.dataset.v2;
      if(k2&&v2!==undefined&&v2!=='null'&&v2!=='undefined'){const both=picked(k.dataset.k,k.dataset.v)&&picked(k2,v2);if(both){dropF(k.dataset.k,k.dataset.v);dropF(k2,v2);}else{if(!picked(k.dataset.k,k.dataset.v))addF(k.dataset.k,k.dataset.v);if(!picked(k2,v2))addF(k2,v2);}}
      else toggleF(k.dataset.k,k.dataset.v);
      tip.style.display='none';render();}});
  document.addEventListener('change',e=>{const s=e.target.closest('[data-xsel]');if(s){if(s.dataset.xsel==='r')XR=s.value;else XC=s.value;render();}});
  const clr=()=>{CROSS={};render();};
  document.getElementById('reset').addEventListener('click',clr);document.getElementById('cbclear').addEventListener('click',clr);
});

</script>
</body></html>
